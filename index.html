    function createLucideIcon(kebabName) {
      return function LucideWrapper({ className = '', style = {}, fill = 'none', ...rest }) {
        const iconDef = window.lucide?.icons?.[kebabName];
        if (!iconDef) return null;
        return React.createElement(
          'svg',
          {
            xmlns: 'http://www.w3.org/2000/svg',
            width: 24,
            height: 24,
            viewBox: '0 0 24 24',
            fill: fill || 'none',
            stroke: 'currentColor',
            strokeWidth: 2,
            strokeLinecap: 'round',
            strokeLinejoin: 'round',
            className,
            style,
            ...rest
          },
          iconDef.map(([tag, attrs], idx) =>
            React.createElement(tag, { ...attrs, key: idx })
          )
        );
      };
    }

      if (!ts) return '';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'Baru saja';
      if (diff < 3600) return `${Math.floor(diff / 60)} mnt lalu`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} jam lalu`;
      return `${Math.floor(diff / 86400)} hari lalu`;

    async function callGeminiAPI({ apiKey, systemInstruction, prompt, imageBase64 = null, jsonMode = false }) {
      const effectiveKey = (apiKey || '').trim();
      const model = 'gemini-2.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${effectiveKey}`;

      const parts = [];
      if (imageBase64 && imageBase64.includes(',')) {
        const [meta, base64Data] = imageBase64.split(',');
        const mimeMatch = meta.match(/data:(.*?);base64/);
        parts.push({
          inlineData: {
            mimeType: mimeMatch ? mimeMatch[1] : 'image/jpeg',
            data: base64Data
          }
        });
      }
      parts.push({ text: prompt });

      const body = {
        contents: [{ role: 'user', parts }],
        systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
        generationConfig: {
          temperature: 0.9,
          ...(jsonMode ? { responseMimeType: 'application/json' } : {})
        }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        throw new Error(`API Error ${res.status}`);
      }

      const data = await res.json();
      return data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

      return `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=768&seed=${effectiveSeed}&nologo=true`;

    function AIImageCard({
      src, caption, onRegenerate, onOpenLightbox, className = 'w-full max-h-56 object-cover rounded-xl'
    }) {
      const [isLoading, setIsLoading] = useState(true);
      const [hasError, setHasError] = useState(false);
      const [cooldownLeft, setCooldownLeft] = useState(0);
      const lastRegenAtRef = useRef(0);

      useEffect(() => {
        setIsLoading(true);
        setHasError(false);
      }, [src]);

      useEffect(() => {
        if (cooldownLeft <= 0) return;
        const timer = setInterval(() => {
          setCooldownLeft((prev) => Math.max(0, prev - 100));
        }, 100);
        return () => clearInterval(timer);
      }, [cooldownLeft]);

      const triggerRegenerate = () => {
        if (!onRegenerate) return;
        const now = Date.now();
        if (now - lastRegenAtRef.current < REGENERATE_DEBOUNCE_MS) return;
        lastRegenAtRef.current = now;
        setCooldownLeft(REGENERATE_DEBOUNCE_MS);
        setHasError(false);
        setIsLoading(true);
        onRegenerate();
      };

      const isCoolingDown = cooldownLeft > 0;

      return (
        <div className="relative group overflow-hidden rounded-xl mb-1.5 bg-black/20">
          {isLoading && !hasError && (
            <div className="absolute inset-0 flex flex-col items-center justify-center bg-white/5 animate-pulse z-10 min-h-[160px]">
              <Sparkles className="w-5 h-5 text-white/70 animate-spin mb-1" />
              <span className="text-[10px] text-white/70 font-medium">Membuat foto AI...</span>
            </div>
          )}

          {hasError ? (
            <div className="flex flex-col items-center justify-center text-center px-4 py-6 min-h-[150px] bg-black/40 border border-white/10 rounded-xl space-y-2">
              <ImageIcon className="w-5 h-5 text-gray-400" />
              <p className="text-[11px] text-gray-300 leading-snug">
                Batas permintaan gambar tercapai sementara / gagal dimuat
              </p>
              {onRegenerate && (
                <button
                  type="button"
                  disabled={isCoolingDown}
                  onClick={triggerRegenerate}
                  className="px-3 py-1.5 rounded-full text-[11px] font-semibold bg-white/15 hover:bg-white/25 text-white disabled:opacity-40 transition"
                >
                  {isCoolingDown ? 'Tunggu sebentar...' : 'Coba Lagi'}
                </button>
              )}
            </div>
          ) : (
            <img
              src={src}
              alt={caption || 'Foto AI'}
              onLoad={() => {
                setIsLoading(false);
                setHasError(false);
              }}
              onError={() => {
                setIsLoading(false);
                setHasError(true);
              }}
              onClick={onOpenLightbox}
              className={`${className} cursor-pointer transition duration-300 ${isLoading ? 'opacity-30 min-h-[160px]' : 'opacity-100'}`}
            />
          )}

          {onRegenerate && !hasError && (
            <button
              type="button"
              disabled={isCoolingDown}
              onClick={(e) => {
                e.stopPropagation();
                triggerRegenerate();
              }}
              title={isCoolingDown ? 'Tunggu jeda sejenak' : 'Regenerate Foto'}
              className="absolute top-2 right-2 z-20 p-1.5 rounded-full bg-black/65 hover:bg-black/85 text-white backdrop-blur-md border border-white/20 shadow-md transition active:scale-90 disabled:opacity-45"
            >
              <RefreshCw className={`w-3.5 h-3.5 ${isLoading || isCoolingDown ? 'animate-spin' : ''}`} />
            </button>
          )}
        </div>
      );
    }

    function ImageLightboxModal({ lightboxData, activeTheme, onClose, onRegenerate }) {
      const [isCoolingDown, setIsCoolingDown] = useState(false);

      if (!lightboxData) return null;

      const handleSafeRegenerate = () => {
        if (!onRegenerate || isCoolingDown) return;
        setIsCoolingDown(true);
        onRegenerate();
        setTimeout(() => setIsCoolingDown(false), REGENERATE_DEBOUNCE_MS);
      };

      const handleDownloadImage = async () => {
        try {
          const response = await fetch(lightboxData.src);
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `orichat-photo-${Date.now()}.jpg`;
          a.click();
          URL.revokeObjectURL(url);
        } catch {
          window.open(lightboxData.src, '_blank');
        }
      };

      return (
        <div onClick={onClose} className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-between p-4 text-white">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-gray-300">{lightboxData.authorName || 'Pratinjau Foto'}</span>
            <button onClick={onClose} className="p-2 rounded-full bg-white/10 hover:bg-white/20">
              <X className="w-5 h-5" />
            </button>
          </div>

          <div onClick={(e) => e.stopPropagation()} className="flex-1 flex flex-col items-center justify-center my-3 overflow-hidden">
            <img src={lightboxData.src} alt="Full Preview" className="max-h-[65vh] max-w-full rounded-2xl object-contain shadow-2xl border border-white/15" />
            {lightboxData.caption && (
              <p className="mt-3 text-xs text-gray-300 text-center max-w-sm px-3 line-clamp-3">
                {lightboxData.caption}
              </p>
            )}
          </div>

          <div onClick={(e) => e.stopPropagation()} className="flex items-center justify-center gap-3 pb-2">
            {onRegenerate && (
              <button
                disabled={isCoolingDown}
                onClick={handleSafeRegenerate}
                className="px-4 py-2.5 rounded-full text-xs font-bold text-white flex items-center gap-1.5 shadow-lg disabled:opacity-45"
                style={{ backgroundColor: activeTheme.primary }}
              >
                <RefreshCw className={`w-4 h-4 ${isCoolingDown ? 'animate-spin' : ''}`} />
                {isCoolingDown ? 'Tunggu...' : 'Regenerate Foto'}
              </button>
            )}
            <button
              onClick={handleDownloadImage}
              className="px-4 py-2.5 rounded-full text-xs font-bold bg-white/15 hover:bg-white/25 text-white flex items-center gap-1.5"
            >
              <Download className="w-4 h-4" /> Simpan Gambar
            </button>
          </div>
        </div>
      );
    }

    function CreateGroupScreen({ characters, apiKey, activeTheme, isDarkMode, onCreate, onBack }) {
      const [name, setName] = useState('');
      const [setting, setSetting] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [search, setSearch] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const toggleMember = (id) => {
        setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      };

      const handleGenerateSetting = async () => {
        setIsGenerating(true);
        try {
          const selectedNames = characters.filter((c) => selectedIds.includes(c.id)).map((c) => c.name).join(', ');
          const res = await callGeminiAPI({
            apiKey,
            systemInstruction: 'Buat latar cerita/suasana singkat (maksimal 350 karakter) untuk ruang obrolan grup chat ponsel dalam Bahasa Indonesia.',
            prompt: `Anggota grup: ${selectedNames || 'Beberapa teman dekat'}. Kata kunci: ${setting || 'grup santai sehari-hari'}`
          });
          setSetting(res.replace(/^"|"$/g, '').trim().slice(0, 500));
        } catch {
          setSetting('Grup chat tempat berkumpul, berbagi cerita harian, janjian makan bareng, dan saling bercanda.');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleCreate = () => {
        if (selectedIds.length === 0) return;
        const selectedChars = characters.filter((c) => selectedIds.includes(c.id));
        const finalName = name.trim() || selectedChars.map((c) => c.name).join(', ').slice(0, 30);

    async function generateDiaryEntryForChar({ char, contextSummary, userPersona, apiKey, onSuccess }) {
      try {
        const content = await callGeminiAPI({
          apiKey,
          systemInstruction: `Kamu adalah ${char.name}. Kepribadian: ${char.personality}.
Tulislah 1 catatan buku harian rahasia (2-3 paragraf) dari sudut pandang orang pertama (POV "Aku" atau "Gw" sesuai gaya bicaramu).
Refleksikan perasaan jujur atau pikiran tersembunyi tentang interaksi terbaru dengan ${userPersona.name}.`,
          prompt: `Konteks kejadian terbaru:\n${contextSummary || 'Obrolan santai hari ini bersama ' + userPersona.name}`
        });
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        const fullTimestamp = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${days[now.getDay()]}`;
        onSuccess({
          id: `diary-${Date.now()}`,
          characterId: char.id,
          dateStr,
          displayDay: pad(now.getDate()),
          fullTimestamp,
          content: content.trim()
        });
      } catch {
        // Silent fallback
      }
    }

    function renderMessageWithHighlights(text, primaryColor) {
      if (!text) return null;
      const parts = text.split(/(@[\w\u00C0-\u024F]+)/g);
      return parts.map((part, idx) =>
        part.startsWith('@') ? (
          <span key={idx} className="font-bold underline decoration-dotted" style={{ color: primaryColor }}>
            {part}
          </span>
        ) : (
          <span key={idx}>{part}</span>
        )
      );
    }

    function PersonalChatScreen({
      char, chatData, userPersona, settings, presenceContext, activeTheme, isDarkMode,
      customStickers, onAddCustomSticker, onOpenCharPhone, onBack,
      onUpdateChat, onOpenCharProfile, onGenerateDiary, onTriggerPresenceReaction, showToast
    }) {
      const [inputText, setInputText] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [replyTo, setReplyTo] = useState(null);
      const [highlightedId, setHighlightedId] = useState(null);
      const [showMeetSetup, setShowMeetSetup] = useState(false);
      const [meetPromptInput, setMeetPromptInput] = useState('');
      const [isGeneratingScene, setIsGeneratingScene] = useState(false);
      const [activeRecapModal, setActiveRecapModal] = useState(null);
      const [collapsedRecaps, setCollapsedRecaps] = useState({});
      const [editingMsgId, setEditingMsgId] = useState(null);
      const [editingText, setEditingText] = useState('');
      const [lightboxMsgId, setLightboxMsgId] = useState(null);
      const lastAutoPhotoRef = useRef({ timestamp: 0, msgIndex: -999, sessionCount: 0 });
      const hasTypedInSessionRef = useRef(false);
      const bottomRef = useRef(null);
      const inputRef = useRef(null);
      const touchStartX = useRef(0);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatData.messages, chatData.meetMessages, isTyping]);

      useEffect(() => {
        if (!char || chatData.inMeetMode || settings.hideOnlineStatus) return;
        hasTypedInSessionRef.current = false;

        const timer = setTimeout(async () => {
          if (hasTypedInSessionRef.current) return;
          setIsTyping(true);
          await onTriggerPresenceReaction(char.id, 'lurking_in_room');
          setIsTyping(false);
        }, 12000);

        return () => clearTimeout(timer);
      }, [char?.id]);

      if (!char) return null;

      const scrollToMessage = (targetId) => {
        const el = document.getElementById(`msg-${targetId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setHighlightedId(targetId);
          setTimeout(() => setHighlightedId(null), 1500);
        }
      };

      const speakText = (txt) => {
        if (!window.speechSynthesis || !txt) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(txt.replace(/\*[^*]+\*/g, ''));
        utter.lang = 'id-ID';
        window.speechSynthesis.speak(utter);
      };

      const handleSendChat = async ({ text, image, sticker }) => {
        hasTypedInSessionRef.current = true;
        const userMsg = {
          id: `u-${Date.now()}`,
          sender: 'user',
          text,
          image,
          sticker,
          replyTo: replyTo
            ? {
                id: replyTo.id,
                senderName: replyTo.sender === 'user' ? userPersona.name : char.name,
                text: replyTo.sticker ? `[Stiker: ${replyTo.sticker.label}]` : replyTo.text || '[Foto]'
              }
            : null,
          timestamp: Date.now()
        };

        const currentReplyContext = userMsg.replyTo;
        setReplyTo(null);

        if (chatData.inMeetMode) {
          const updatedMeet = [...(chatData.meetMessages || []), userMsg];
          onUpdateChat((prev) => ({ ...prev, meetMessages: updatedMeet }));
          setIsTyping(true);
          try {
            const historyStr = updatedMeet.slice(-8).map((m) => `${m.sender === 'user' ? userPersona.name : char.name}: ${m.text}`).join('\n');
            const reply = await callGeminiAPI({
              apiKey: settings.apiKey,
              imageBase64: image || null,
              systemInstruction: `Kamu sedang dalam MODE TEMU (Roleplay Adegan Bertemu Langsung) sebagai ${char.name}.
Kepribadian: ${char.personality}
Latar adegan pertemuan: ${chatData.meetScene}
ATURAN WAJIB: Gunakan narasi deskriptif mendalam (suasana, ekspresi wajah, gestur tubuh seperti novel) dipadukan dengan dialog berpetik "...".`,
              prompt: `Riwayat adegan:\n${historyStr}\n\nLanjutkan adegan:`
            });
            onUpdateChat((prev) => ({
              ...prev,
              meetMessages: [
                ...(prev.meetMessages || []),
                { id: `m-ai-${Date.now()}`, sender: 'ai', text: reply.trim(), timestamp: Date.now() }
              ]
            }));
          } catch {
            showToast('Gagal merespons adegan. Periksa API Key.');
          } finally {
            setIsTyping(false);
          }
          return;
        }

        const updatedMessages = [...(chatData.messages || []), userMsg];
        onUpdateChat((prev) => ({ ...prev, messages: updatedMessages }));
        setIsTyping(true);

        const requestedByUser = userExplicitlyRequestedPhoto(text);
        const nowTs = Date.now();
        const currentMsgIndex = updatedMessages.length;
        const withinTimeCooldown = nowTs - lastAutoPhotoRef.current.timestamp < PHOTO_COOLDOWN_MS;
        const withinTurnGap = currentMsgIndex - lastAutoPhotoRef.current.msgIndex < PHOTO_MIN_TURNS_GAP;
        const sessionCapReached = lastAutoPhotoRef.current.sessionCount >= 1;
        const allowAutoPhoto = requestedByUser || (!withinTimeCooldown && !withinTurnGap && !sessionCapReached);

        const nowFormatted = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const presenceSystemNote = settings.hideOnlineStatus
          ? `[Info Sistem: Pengguna mengaktifkan mode penyamaran status online. Saat ini pukul ${nowFormatted} WIB.]`
          : `[Info Sistem: Status Online pengguna terlihat olehmu. Saat ini pukul ${nowFormatted} WIB (${getGreetingPeriod()}).${
              presenceContext?.summary ? ` ${presenceContext.summary}` : ''
            }]`;

        try {
          const historyStr = updatedMessages
            .slice(-10)
            .map((m) => {
              const who = m.sender === 'user' ? userPersona.name : char.name;
              const body = m.sticker ? `[Mengirim stiker: ${m.sticker.label}]` : m.image ? `[Mengirim foto] ${m.text}` : m.text;
              return `[ID:${m.id}] ${who}: ${body}`;
            })
            .join('\n');

          const replyContextInstruction = currentReplyContext
            ? `\nPengguna baru saja me-reply pesan spesifik dari ${currentReplyContext.senderName}: "${currentReplyContext.text}".`
            : '';

          const photoInstruction = allowAutoPhoto
            ? `6. KIRIM FOTO AI (HEMAT & SELEKTIF): Sisipkan [SEND_PHOTO: deskripsi adegan foto dalam bahasa Inggris] HANYA jika ${
                requestedByUser
                  ? 'pengguna baru saja meminta foto/PAP secara eksplisit'
                  : 'ada momen yang sangat spesial/hidup (maksimal ~10-15% giliran dan JANGAN di giliran beruntun)'
              }. Lebih baik balas teks saja jika tidak perlu foto.`
            : `6. JANGAN KIRIM FOTO: Jangan menyisipkan tag [SEND_PHOTO: ...] pada giliran ini. Balas murni dengan teks chat/stiker saja.`;

          const rawReply = await callGeminiAPI({
            apiKey: settings.apiKey,
            imageBase64: image || null,
            systemInstruction: `Kamu adalah ${char.name} yang sedang chatting lewat ponsel dengan ${userPersona.name}.
Profil Pengguna: ${userPersona.bio}
Kepribadian Karakter: ${char.personality}
Contoh Gaya Ketik Asli:
${(char.sampleChats || []).join('\n')}
Memori Grup Terakhir: ${(char.groupMemories || []).join('; ') || 'Belum ada'}
${presenceSystemNote}

ATURAN MUTLAK MODE CHAT PONSEL:
1. DILARANG KERAS menulis narasi tindakan, gerakan tubuh, atau tanda bintang (*tersenyum*, *menghela napas*, dll). Balas 100% seperti pesan chat ponsel nyata.
2. Pisahkan tiap gelembung pesan (bubble) dengan baris baru (\\n).
3. Sesuaikan jumlah bubble dengan sifatmu: jika bawel/antusias kirim 3-5 bubble pendek beruntun; jika santai kirim 1-3 bubble; jika dingin/cuek kirim 1 bubble sangat singkat.
4. Jangan bersikap seperti asisten AI dan jangan selalu bertanya balik.
5. Kamu boleh sesekali menyisipkan stiker di baris terpisah dengan format [STICKER:senang], [STICKER:ngambek], [STICKER:ngantuk], [STICKER:peluk], atau [STICKER:wkwk].
${photoInstruction}${replyContextInstruction}`,
            prompt: `Riwayat chat terakhir:\n${historyStr}\n\nBalas sebagai ${char.name}:`
          });

          const lines = rawReply
            .split('\n')
            .map((l) => l.replace(/\*[^*]+\*/g, '').trim())
            .filter(Boolean);

          let photoSentInTurn = false;
          for (let i = 0; i < lines.length; i++) {
            setIsTyping(true);
            const delay = Math.min(1800, Math.max(750, lines[i].length * 25));
            await sleep(delay);

            const photoMatch = lines[i].match(/\[SEND_PHOTO:\s*(.*?)\]/i);
            const stkMatch = lines[i].match(/\[STICKER:(.*?)\]/i);
            let msgBubble;
            if (photoMatch && allowAutoPhoto && !photoSentInTurn) {
              photoSentInTurn = true;
              lastAutoPhotoRef.current = {
                timestamp: Date.now(),
                msgIndex: currentMsgIndex,
                sessionCount: requestedByUser
                  ? lastAutoPhotoRef.current.sessionCount
                  : lastAutoPhotoRef.current.sessionCount + 1
              };
              const scenePrompt = photoMatch[1].trim();
              msgBubble = {
                id: `ai-photo-${Date.now()}-${i}`,
                sender: 'ai',
                text: '',
                image: buildCharacterImageUrl(char, scenePrompt),
                imagePrompt: scenePrompt,
                timestamp: Date.now()
              };
            } else if (photoMatch) {
              continue;
            } else if (stkMatch) {
              const foundStk =
                DEFAULT_STICKERS.find((s) => s.label.toLowerCase().includes(stkMatch[1].toLowerCase()) || s.id.includes(stkMatch[1].toLowerCase())) ||
                DEFAULT_STICKERS[1];
              msgBubble = {
                id: `ai-${Date.now()}-${i}`,
                sender: 'ai',
                text: '',
                sticker: foundStk,
                timestamp: Date.now()
              };
            } else {
              msgBubble = {
                id: `ai-${Date.now()}-${i}`,
                sender: 'ai',
                text: lines[i],
                replyTo: i === 0 && Math.random() < 0.25 ? { id: userMsg.id, senderName: userPersona.name, text: userMsg.text || '[Media]' } : null,
                timestamp: Date.now()
              };
            }

            onUpdateChat((prev) => ({
              ...prev,
              messages: [...(prev.messages || []), msgBubble]
            }));
          }
        } catch {
          showToast('Gagal memanggil Gemini API. Pastikan API Key sudah diisi di tab Saya.');
        } finally {
          setIsTyping(false);
        }
      };

      const handleRequestCharacterPhoto = async () => {
        if (isTyping) return;
        setIsTyping(true);
        try {
          const recentStr = (chatData.messages || []).slice(-6).map((m) => m.text).filter(Boolean).join(' | ');
          const raw = await callGeminiAPI({
            apiKey: settings.apiKey,
            jsonMode: true,
            systemInstruction: `Kamu adalah ${char.name}. Kepribadian: ${char.personality}.
Pengguna meminta kamu mengirim foto/PAP situasi sekarang.
Kembalikan JSON: { "scenePrompt": "deskripsi foto visual detail dalam bahasa Inggris (selfie/POV/makanan/suasana sesuai aktivitasmu)", "caption": "1 pesan chat singkat khas ${char.name} tanpa narasi saat mengirim foto ini" }`,
            prompt: `Konteks obrolan terakhir: ${recentStr || 'Santai hari ini'}`
          });
          const parsed = JSON.parse(raw);
          const scenePrompt = parsed.scenePrompt || `casual POV selfie of ${char.name} relaxing`;
          const photoMsg = {
            id: `ai-pap-${Date.now()}`,
            sender: 'ai',
            text: (parsed.caption || '').replace(/\*[^*]+\*/g, '').trim(),
            image: buildCharacterImageUrl(char, scenePrompt),
            imagePrompt: scenePrompt,
            timestamp: Date.now()
          };
          onUpdateChat((prev) => ({
            ...prev,
            messages: [...(prev.messages || []), photoMsg]
          }));
        } catch {
          const fallbackScene = `casual aesthetic smartphone photo taken by ${char.name}, cozy atmosphere`;
          onUpdateChat((prev) => ({
            ...prev,
            messages: [
              ...(prev.messages || []),
              {
                id: `ai-pap-${Date.now()}`,
                sender: 'ai',
                text: 'nih foto barusan',
                image: buildCharacterImageUrl(char, fallbackScene),
                imagePrompt: fallbackScene,
                timestamp: Date.now()
              }
            ]
          }));
        } finally {
          setIsTyping(false);
        }
      };

      const handleRegenerateChatPhoto = (msgId) => {
        onUpdateChat((prev) => ({
          ...prev,
          messages: (prev.messages || []).map((m) => {
            if (m.id !== msgId || !m.imagePrompt) return m;
            return {
              ...m,
              image: buildCharacterImageUrl(char, m.imagePrompt, Math.floor(Math.random() * 9999999))
            };
          })
        }));
      };

      const handleGenerateSceneIdea = async () => {
        setIsGeneratingScene(true);
        try {
          const res = await callGeminiAPI({
            apiKey: settings.apiKey,
            systemInstruction: 'Buat 1 ide skenario pertemuan langsung (2-3 kalimat, maksimal 400 karakter) yang natural dan sesuai kepribadian karakter.',
            prompt: `Karakter: ${char.name} (${char.personality.slice(0, 250)}). Kata kunci: ${meetPromptInput || 'bertemu santai hari ini'}`
          });
          setMeetPromptInput(res.trim().slice(0, 500));
        } catch {
          setMeetPromptInput(`${char.name} mengajak ${userPersona.name} bertemu di kafe sudut jalan menjelang sore untuk melepas penat.`);
        } finally {
          setIsGeneratingScene(false);
        }
      };

      const handleStartMeetMode = async () => {
        const scene = meetPromptInput.trim() || `${char.name} dan ${userPersona.name} bertemu langsung hari ini.`;
        setShowMeetSetup(false);
        onUpdateChat((prev) => ({
          ...prev,
          inMeetMode: true,
          meetScene: scene,
          meetMessages: []
        }));
        setIsTyping(true);
        try {
          const openingScene = await callGeminiAPI({
            apiKey: settings.apiKey,
            systemInstruction: `Kamu adalah narator dan karakter ${char.name} dalam MODE TEMU (adegan bertemu langsung).
Kepribadian: ${char.personality}
Gunakan narasi deskriptif novel (latar, ekspresi, gestur) dan dialog berpetik "...".`,
            prompt: `Mulai adegan pertemuan dengan skenario: ${scene}`
          });
          onUpdateChat((prev) => ({
            ...prev,
            meetMessages: [{ id: `m-open-${Date.now()}`, sender: 'ai', text: openingScene.trim(), timestamp: Date.now() }]
          }));
        } catch {
          onUpdateChat((prev) => ({
            ...prev,
            meetMessages: [{ id: `m-open-${Date.now()}`, sender: 'ai', text: `${char.name} melangkah mendekat sambil tersenyum tipis. "Akhirnya ketemu juga."`, timestamp: Date.now() }]
          }));
        } finally {
          setIsTyping(false);
        }
      };

      const handleEndMeetMode = async () => {
        const recapId = `recap-${Date.now()}`;
        const sceneLogs = chatData.meetMessages || [];
        const recapObj = {
          id: recapId,
          scene: chatData.meetScene,
          logs: sceneLogs,
          endedAt: Date.now()
        };

        onUpdateChat((prev) => ({
          ...prev,
          inMeetMode: false,
          meetRecaps: [...(prev.meetRecaps || []), recapObj],
          messages: [
            ...(prev.messages || []),
            {
              id: `sys-${recapId}`,
              sender: 'system',
              recapId,
              scene: chatData.meetScene,
              timestamp: Date.now()
            }
          ]
        }));

        const summaryText = sceneLogs.map((m) => m.text).join(' ').slice(0, 600);
        onGenerateDiary(char, `Baru saja selesai bertemu langsung (${chatData.meetScene}): ${summaryText}`);

        setIsTyping(true);
        try {
          const followUp = await callGeminiAPI({
            apiKey: settings.apiKey,
            systemInstruction: `Kamu ${char.name}. Kalian baru saja selesai bertemu langsung (${chatData.meetScene}) dan sekarang kembali ke chat ponsel biasa.
Kirim 1-2 bubble chat ponsel TANPA narasi tindakan yang menyinggung momen pertemuan barusan.`,
            prompt: `Ringkasan pertemuan tadi: ${summaryText}`
          });
          const lines = followUp.split('\n').map((l) => l.replace(/\*[^*]+\*/g, '').trim()).filter(Boolean).slice(0, 2);
          for (let i = 0; i < lines.length; i++) {
            await sleep(700);
            onUpdateChat((prev) => ({
              ...prev,
              messages: [
                ...(prev.messages || []),
                { id: `postmeet-${Date.now()}-${i}`, sender: 'ai', text: lines[i], timestamp: Date.now() }
              ]
            }));
          }
        } catch {
          // Ignore
        } finally {
          setIsTyping(false);
        }
      };

      const activeList = chatData.inMeetMode ? chatData.meetMessages || [] : chatData.messages || [];

      return (
        <div className={`fixed inset-0 z-40 flex justify-center ${isDarkMode ? 'bg-[#121117] text-white' : 'bg-[#F6F5FA] text-gray-900'}`}>
          <div className="w-full max-w-md flex flex-col h-full relative">
            <div className={`px-3 py-3 border-b flex items-center justify-between ${isDarkMode ? 'bg-[#16151D] border-white/10' : 'bg-white border-gray-200'}`}>
              <div className="flex items-center gap-2.5 min-w-0">
                <button onClick={onBack} className="p-1.5 rounded-full hover:bg-white/10">
                  <ChevronLeft className="w-5 h-5" />
                </button>
                <div onClick={() => onOpenCharProfile(char.id)} className="flex items-center gap-2.5 cursor-pointer min-w-0">
                  <div className="relative shrink-0">
                    <img src={char.avatar} alt={char.name} className="w-9 h-9 rounded-full object-cover" />
                    <span className="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-[#16151D]" />
                  </div>
                  <div className="min-w-0">
                    <h2 className="font-bold text-sm truncate">{char.name}</h2>
                    <div className="flex items-center gap-1.5 text-[10px] text-gray-400">
                      {chatData.inMeetMode ? (
                        <span style={{ color: activeTheme.primary }}>✨ Mode Temu Aktif</span>
                      ) : isTyping ? (
                        <span style={{ color: activeTheme.primary }}>sedang mengetik...</span>
                      ) : (
                        <>
                          <span className="text-emerald-400 font-medium">Online</span>
                          <span>·</span>
                          <span className="truncate">
                            {settings.hideOnlineStatus ? 'Statusmu tersembunyi' : 'Melihatmu online'}
                          </span>
                        </>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                {!chatData.inMeetMode && (
                  <button
                    onClick={handleRequestCharacterPhoto}
                    title="Minta Foto / PAP"
                    className="p-2 rounded-full hover:bg-white/10"
                    style={{ color: activeTheme.primary }}
                  >
                    <Camera className="w-4 h-4" />
                  </button>
                )}
                <button
                  onClick={() => onOpenCharPhone(char.id)}
                  title="Ponsel Karakter"
                  className="p-2 rounded-full hover:bg-white/10"
                  style={{ color: activeTheme.primary }}
                >
                  <Smartphone className="w-4 h-4" />
                </button>
                {chatData.inMeetMode ? (
                  <button
                    onClick={handleEndMeetMode}
                    className="px-3 py-1.5 rounded-full text-[11px] font-bold bg-rose-500 text-white"
                  >
                    Akhiri Temu
                  </button>
                ) : (
                  <button
                    onClick={() => setShowMeetSetup(true)}
                    className="px-3 py-1.5 rounded-full text-[11px] font-bold flex items-center gap-1"
                    style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}
                  >
                    <Users className="w-3.5 h-3.5" /> Temu
                  </button>
                )}
              </div>
            </div>

            {chatData.inMeetMode && (
              <div className="px-4 py-2 text-[11px] border-b border-white/10 flex items-center justify-between" style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}>
                <span className="truncate font-medium">📍 Adegan: {chatData.meetScene}</span>
              </div>
            )}

            <div className="flex-1 overflow-y-auto overflow-x-hidden p-3.5 space-y-3">
              {activeList.map((msg) => {
                if (msg.sender === 'system') {
                  const isCollapsed = collapsedRecaps[msg.id];
                  const recap = (chatData.meetRecaps || []).find((r) => r.id === msg.recapId);
                  return (
                    <div key={msg.id} className={`p-3.5 rounded-2xl border text-center space-y-2 ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200'}`}>
                      <p className="text-xs font-bold" style={{ color: activeTheme.primary }}>
                        ✨ Adegan bertemu telah berakhir
                      </p>
                      {!isCollapsed && <p className="text-[11px] text-gray-400">{msg.scene}</p>}
                      <div className="flex items-center justify-center gap-2 pt-1">
                        {recap && (
                          <button
                            onClick={() => setActiveRecapModal(recap)}
                            className="px-3 py-1 rounded-full text-[11px] font-semibold text-white"
                            style={{ backgroundColor: activeTheme.primary }}
                          >
                            Lihat rekap
                          </button>
                        )}
                        <button
                          onClick={() => setCollapsedRecaps((p) => ({ ...p, [msg.id]: !isCollapsed }))}
                          className="px-3 py-1 rounded-full text-[11px] border border-white/15 text-gray-400"
                        >
                          {isCollapsed ? 'Bentangkan' : 'Ciutkan kartu'}
                        </button>
                      </div>
                    </div>
                  );
                }

                const isUser = msg.sender === 'user';
                return (
                  <div
                    id={`msg-${msg.id}`}
                    key={msg.id}
                    onTouchStart={(e) => { touchStartX.current = e.touches[0].clientX; }}
                    onTouchEnd={(e) => {
                      if (e.changedTouches[0].clientX - touchStartX.current > 60) {
                        setReplyTo(msg);
                        inputRef.current?.focus();
                      }
                    }}
                    className={`flex items-end gap-2 group transition-all rounded-2xl ${isUser ? 'justify-end' : 'justify-start'} ${highlightedId === msg.id ? 'ring-2 ring-amber-400 p-1' : ''}`}
                  >
                    {!isUser && <img src={char.avatar} alt={char.name} className="w-7 h-7 rounded-full object-cover shrink-0 mb-1" />}

                    <div className={`max-w-[78%] min-w-0 space-y-1 ${isUser ? 'items-end' : 'items-start'} flex flex-col`}>
                      {msg.sticker ? (
                        <div className="p-2">
                          {msg.sticker.image ? (
                            <img src={msg.sticker.image} alt={msg.sticker.label} className="w-24 h-24 object-contain" />
                          ) : (
                            <div className={`w-24 h-24 rounded-3xl bg-gradient-to-br ${msg.sticker.bg} flex flex-col items-center justify-center border border-white/10`}>
                              <span className="text-4xl">{msg.sticker.emoji}</span>
                              <span className="text-[10px] font-bold mt-1">{msg.sticker.label}</span>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div
                          className={`px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed whitespace-pre-wrap break-words [overflow-wrap:anywhere] overflow-hidden ${isUser ? 'text-white' : isDarkMode ? 'bg-[#1C1A24]' : 'bg-white border border-gray-200'}`}
                          style={isUser ? { backgroundColor: activeTheme.bubbleBg, color: activeTheme.bubbleText } : {}}
                        >
                          {msg.replyTo && (
                            <div
                              onClick={() => scrollToMessage(msg.replyTo.id)}
                              className="mb-1.5 rounded-lg border-l-4 border-white/60 bg-black/20 px-2.5 py-1 text-[11px] cursor-pointer overflow-hidden"
                            >
                              <p className="font-bold truncate">{msg.replyTo.senderName}</p>
                              <p className="opacity-80 line-clamp-3 break-words [overflow-wrap:anywhere]">{msg.replyTo.text}</p>
                            </div>
                          )}

                          {msg.image && (
                            msg.imagePrompt ? (
                              <AIImageCard
                                src={msg.image}
                                caption={msg.text || msg.imagePrompt}
                                onRegenerate={() => handleRegenerateChatPhoto(msg.id)}
                                onOpenLightbox={() => setLightboxMsgId(msg.id)}
                              />
                            ) : (
                              <img
                                src={msg.image}
                                alt="Lampiran"
                                onClick={() => setLightboxMsgId(msg.id)}
                                className="w-full max-h-52 object-cover rounded-xl mb-1.5 cursor-pointer"
                              />
                            )
                          )}
                          {editingMsgId === msg.id ? (
                            <div className="space-y-1.5 min-w-[180px]">
                              <textarea
                                rows={2}
                                value={editingText}
                                onChange={(e) => setEditingText(e.target.value)}
                                className="w-full p-1.5 rounded bg-black/30 text-white text-xs outline-none"
                              />
                              <div className="flex justify-end gap-1.5 text-[10px]">
                                <button onClick={() => setEditingMsgId(null)} className="px-2 py-0.5 rounded bg-white/10">Batal</button>
                                <button
                                  onClick={() => {
                                    onUpdateChat((prev) => ({
                                      ...prev,
                                      messages: (prev.messages || []).map((m) => (m.id === msg.id ? { ...m, text: editingText } : m))
                                    }));
                                    setEditingMsgId(null);
                                  }}
                                  className="px-2 py-0.5 rounded bg-emerald-500 text-white font-bold"
                                >
                                  Simpan
                                </button>
                              </div>
                            </div>
                          ) : (
                            renderMessageWithHighlights(msg.text, isUser ? '#FDE68A' : activeTheme.primary)
                          )}
                        </div>
                      )}

                      <div className={`flex items-center gap-2 px-1 text-[10px] text-gray-400 ${isUser ? 'flex-row-reverse' : ''}`}>
                        <span>{formatTimeShort(msg.timestamp)}</span>
                        <button
                          onClick={() => {
                            setReplyTo(msg);
                            inputRef.current?.focus();
                          }}
                          title="Balas"
                          className="hover:text-white"
                        >
                          <Reply className="w-3 h-3" />
                        </button>
                        {msg.text && (
                          <button onClick={() => speakText(msg.text)} title="Suara" className="hover:text-white">
                            <Volume2 className="w-3 h-3" />
                          </button>
                        )}
                        {msg.text && !chatData.inMeetMode && (
                          <button
                            onClick={() => {
                              setEditingMsgId(msg.id);
                              setEditingText(msg.text);
                            }}
                            title="Edit"
                            className="hover:text-white"
                          >
                            <Edit3 className="w-3 h-3" />
                          </button>
                        )}
                        <button
                          onClick={() =>
                            onUpdateChat((prev) => ({
                              ...prev,
                              [chatData.inMeetMode ? 'meetMessages' : 'messages']: (
                                prev[chatData.inMeetMode ? 'meetMessages' : 'messages'] || []
                              ).filter((m) => m.id !== msg.id)
                            }))
                          }
                          title="Hapus"
                          className="hover:text-rose-400"
                        >
                          <Trash2 className="w-3 h-3" />
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}

              {isTyping && (
                <div className="flex items-center gap-2 text-xs text-gray-400">
                  <img src={char.avatar} alt={char.name} className="w-7 h-7 rounded-full object-cover" />
                  <div className={`px-3.5 py-2 rounded-2xl ${isDarkMode ? 'bg-[#1C1A24]' : 'bg-white border border-gray-200'}`}>
                    <span className="animate-pulse">sedang mengetik...</span>
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>

            <StickerAndAttachmentBar
              inputText={inputText}
              setInputText={(val) => {
                if (val.trim()) hasTypedInSessionRef.current = true;
                setInputText(val);
              }}
              onSendMessage={handleSendChat}
              customStickers={customStickers}
              onAddCustomSticker={onAddCustomSticker}
              replyTo={replyTo}
              onCancelReply={() => setReplyTo(null)}
              activeTheme={activeTheme}
              isDarkMode={isDarkMode}
              placeholder={chatData.inMeetMode ? 'Tulis tindakan atau dialog...' : `Kirim pesan ke ${char.name}...`}
              inputRef={inputRef}
            />

            {showMeetSetup && (
              <div className="fixed inset-0 z-50 bg-black/70 flex items-end justify-center">
                <div className={`w-full max-w-md rounded-t-3xl p-5 space-y-4 ${isDarkMode ? 'bg-[#1C1A24] text-white' : 'bg-white text-gray-900'}`}>
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base">Atur adegan pertemuan</h3>
                    <button onClick={() => setShowMeetSetup(false)} className="p-1 text-gray-400">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-gray-400">Skenario / Lokasi Pertemuan</span>
                      <button
                        disabled={isGeneratingScene}
                        onClick={handleGenerateSceneIdea}
                        className="font-semibold flex items-center gap-1"
                        style={{ color: activeTheme.primary }}
                      >
                        <Sparkles className="w-3.5 h-3.5" /> {isGeneratingScene ? 'Menulis...' : 'Bantu tulis'}
                      </button>
                    </div>
                    <textarea
                      rows={4}
                      maxLength={500}
                      value={meetPromptInput}
                      onChange={(e) => setMeetPromptInput(e.target.value)}
                      placeholder="Contoh: Ketemuan di kafe dekat kampus saat hujan sore..."
                      className={`w-full p-3 rounded-2xl border text-xs outline-none resize-none ${isDarkMode ? 'bg-[#121117] border-white/10' : 'bg-gray-100 border-gray-200'}`}
                    />
                  </div>
                  <button
                    onClick={handleStartMeetMode}
                    className="w-full py-3 rounded-2xl text-xs font-bold text-white"
                    style={{ backgroundColor: activeTheme.primary }}
                  >
                    Mulai bertemu sekarang
                  </button>
                </div>
              </div>
            )}

            {activeRecapModal && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className={`w-full max-w-md max-h-[80vh] flex flex-col rounded-3xl p-5 space-y-3 ${isDarkMode ? 'bg-[#1C1A24] text-white' : 'bg-white text-gray-900'}`}>
                  <div className="flex items-center justify-between border-b border-white/10 pb-2.5">
                    <h3 className="font-bold text-sm">Rekap Adegan Bertemu</h3>
                    <button onClick={() => setActiveRecapModal(null)} className="p-1 text-gray-400">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                  <p className="text-[11px] font-semibold" style={{ color: activeTheme.primary }}>
                    📍 {activeRecapModal.scene}
                  </p>
                  <div className="flex-1 overflow-y-auto space-y-2.5 text-xs leading-relaxed">
                    {(activeRecapModal.logs || []).map((l, idx) => (
                      <p key={idx} className={l.sender === 'user' ? 'font-semibold text-gray-300' : ''}>
                        {l.sender === 'user' ? `${userPersona.name}: ${l.text}` : l.text}
                      </p>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <ImageLightboxModal
              lightboxData={(() => {
                const target = activeList.find((m) => m.id === lightboxMsgId);
                if (!target?.image) return null;
                return {
                  src: target.image,
                  caption: target.text || target.imagePrompt,
                  authorName: target.sender === 'user' ? userPersona.name : char.name
                };
              })()}
              activeTheme={activeTheme}
              onClose={() => setLightboxMsgId(null)}
              onRegenerate={(() => {
                const target = activeList.find((m) => m.id === lightboxMsgId);
                return target?.imagePrompt ? () => handleRegenerateChatPhoto(target.id) : null;
              })()}
            />
          </div>
        </div>
      );
    }

    function GroupChatScreen({
      group, characters, userPersona, settings, presenceContext, activeTheme, isDarkMode,
      customStickers, onAddCustomSticker, onBack, onUpdateGroup, onTriggerPrivateDM, showToast
    }) {
      const [inputText, setInputText] = useState('');
      const [typingMember, setTypingMember] = useState(null);
      const [readByNames, setReadByNames] = useState([]);
      const [replyTo, setReplyTo] = useState(null);
      const [highlightedId, setHighlightedId] = useState(null);
      const [mentionQuery, setMentionQuery] = useState(null);
      const [lightboxMsgId, setLightboxMsgId] = useState(null);
      const memberPhotoTrackerRef = useRef({});
      const bottomRef = useRef(null);
      const inputRef = useRef(null);
      const touchStartX = useRef(0);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [group?.messages, typingMember]);

      if (!group) return null;
      const members = characters.filter((c) => group.memberIds.includes(c.id));

      const scrollToMessage = (targetId) => {
        const el = document.getElementById(`gmsg-${targetId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setHighlightedId(targetId);
          setTimeout(() => setHighlightedId(null), 1500);
        }
      };

      const handleInputMentionDetect = (val) => {
        const match = val.match(/@([\w\u00C0-\u024F]*)$/);
        if (match) {
          setMentionQuery(match[1].toLowerCase());
        } else {
          setMentionQuery(null);
        }
      };

      const insertMention = (memberName, replaceTrigger = false) => {
        if (replaceTrigger) {
          setInputText((prev) => prev.replace(/@[\w\u00C0-\u024F]*$/, `@${memberName} `));
        } else {
          setInputText((prev) => `${prev}${prev && !prev.endsWith(' ') ? ' ' : ''}@${memberName} `);
        }
        setMentionQuery(null);
        inputRef.current?.focus();
      };

      const runGroupResponses = async (currentMessages, latestUserMsg = null, imageBase64 = null) => {
        setReadByNames([]);
        const textToCheck = latestUserMsg?.text || '';
        const mentionedIds = members
          .filter((m) => textToCheck.toLowerCase().includes(`@${m.name.toLowerCase()}`))
          .map((m) => m.id);
        const repliedSenderId = latestUserMsg?.replyTo?.senderId;

        const orderedMembers = [...members].sort((a, b) => {
          const aPriority = mentionedIds.includes(a.id) || a.id === repliedSenderId ? 1 : 0;
          const bPriority = mentionedIds.includes(b.id) || b.id === repliedSenderId ? 1 : 0;
          return bPriority - aPriority;
        });

        let workingMessages = [...currentMessages];
        const silentNames = [];
        let anyPhotoSentThisRound = false;
        const nowFormatted = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const presenceNote = settings.hideOnlineStatus
          ? `Saat ini pukul ${nowFormatted} WIB.`
          : `Saat ini pukul ${nowFormatted} WIB, status Online ${userPersona.name} terlihat aktif.${
              presenceContext?.summary ? ` ${presenceContext.summary}` : ''
            }`;

        for (const member of orderedMembers) {
          const isForced = mentionedIds.includes(member.id) || member.id === repliedSenderId;
          const memberRequestedPhoto = isForced && userExplicitlyRequestedPhoto(textToCheck);
          const prevPhoto = memberPhotoTrackerRef.current[member.id] || {
            timestamp: 0,
            msgCount: -999,
            sessionCount: 0
          };
          const timeOk = Date.now() - prevPhoto.timestamp >= PHOTO_COOLDOWN_MS;
          const gapOk = workingMessages.length - prevPhoto.msgCount >= PHOTO_MIN_TURNS_GAP;
          const sessionOk = prevPhoto.sessionCount < 1;
          const allowMemberPhoto =
            !anyPhotoSentThisRound && (memberRequestedPhoto || (timeOk && gapOk && sessionOk));

          setTypingMember(member);
          try {
            const historyStr = workingMessages
              .slice(-12)
              .map((m) => `[ID:${m.id}] ${m.senderName}: ${m.sticker ? `[Stiker: ${m.sticker.label}]` : m.image ? `[Foto] ${m.text}` : m.text}`)
              .join('\n');

            const raw = await callGeminiAPI({
              apiKey: settings.apiKey,
              imageBase64,
              systemInstruction: `Kamu adalah ${member.name} di dalam grup chat ponsel "${group.name}".
Latar Grup: ${group.setting}
Kepribadianmu: ${member.personality}
Contoh ketikmu: ${(member.sampleChats || []).join('\n')}
Info Waktu & Kehadiran: ${presenceNote}

ATURAN CHAT GRUP:
1. Balas TANPA narasi tindakan atau tanda bintang. Gunakan gaya chat grup ponsel alami.
2. Sesuaikan jumlah bubble (dipisah baris baru \\n) dengan kepribadianmu: bawel 3-5 bubble, santai 1-2 bubble, dingin/cuek 1 bubble singkat.
3. ${isForced ? 'WAJIB MEMBALAS karena kamu baru saja dipanggil/di-reply!' : 'Jika topik tidak menarik perhatianmu atau sifatmu cuek/sibuk, balas HANYA dengan "[SKIP]".'}
4. Kamu boleh me-mention @NamaAnggotaLain atau @${userPersona.name}.${
                allowMemberPhoto
                  ? ` Kamu hanya boleh menyisipkan [SEND_PHOTO: deskripsi foto bahasa Inggris] jika ${
                      memberRequestedPhoto ? 'diminta langsung' : 'benar-benar ada momen spesial (jarang, ~10-15%)'
                    }.`
                  : ' JANGAN menyisipkan [SEND_PHOTO: ...] pada giliran ini.'
              }`,
              prompt: `Riwayat chat grup:\n${historyStr}\n\nGiliran ${member.name}:`
            });

            const cleaned = raw.trim();
            if (!isForced && cleaned === '[SKIP]') {
              silentNames.push(member.name);
              continue;
            }

            const lines = cleaned
              .split('\n')
              .map((l) => l.replace(/\*[^*]+\*/g, '').trim())
              .filter((l) => l && l !== '[SKIP]');

            for (let i = 0; i < lines.length; i++) {
              setTypingMember(member);
              await sleep(Math.min(1600, Math.max(700, lines[i].length * 22)));
              const photoMatch = lines[i].match(/\[SEND_PHOTO:\s*(.*?)\]/i);
              if (photoMatch && !allowMemberPhoto) {
                continue;
              }
              if (photoMatch) {
                anyPhotoSentThisRound = true;
                memberPhotoTrackerRef.current[member.id] = {
                  timestamp: Date.now(),
                  msgCount: workingMessages.length,
                  sessionCount: memberRequestedPhoto ? prevPhoto.sessionCount : prevPhoto.sessionCount + 1
                };
              }
              const newBubble = photoMatch
                ? {
                    id: `gm-photo-${Date.now()}-${member.id}-${i}`,
                    senderId: member.id,
                    senderName: member.name,
                    text: '',
                    image: buildCharacterImageUrl(member, photoMatch[1].trim()),
                    imagePrompt: photoMatch[1].trim(),
                    timestamp: Date.now()
                  }
                : {
                    id: `gm-${Date.now()}-${member.id}-${i}`,
                    senderId: member.id,
                    senderName: member.name,
                    text: lines[i],
                    replyTo:
                      i === 0 && isForced && latestUserMsg
                        ? {
                            id: latestUserMsg.id,
                            senderId: 'user',
                            senderName: userPersona.name,
                            text: latestUserMsg.text || '[Media]'
                          }
                        : null,
                    timestamp: Date.now()
                  };
              workingMessages = [...workingMessages, newBubble];
              onUpdateGroup({ ...group, messages: workingMessages });
            }
          } catch {
            // Ignore single member failure
          }
        }

        setTypingMember(null);
        setReadByNames(silentNames);
      };

      const handleSendGroupMessage = async ({ text, image, sticker }) => {
        const userMsg = {
          id: `gu-${Date.now()}`,
          senderId: 'user',
          senderName: userPersona.name,
          text,
          image,
          sticker,
          replyTo: replyTo
            ? {
                id: replyTo.id,
                senderId: replyTo.senderId,
                senderName: replyTo.senderName,
                text: replyTo.sticker ? `[Stiker: ${replyTo.sticker.label}]` : replyTo.text || '[Foto]'
              }
            : null,
          timestamp: Date.now()
        };
        setReplyTo(null);
        const updated = [...(group.messages || []), userMsg];
        onUpdateGroup({ ...group, messages: updated });
        await runGroupResponses(updated, userMsg, image || null);
      };

      const handleRequestGroupPhoto = async () => {
        if (typingMember || members.length === 0) return;
        const picker = members[Math.floor(Math.random() * members.length)];
        setTypingMember(picker);
        try {
          const raw = await callGeminiAPI({
            apiKey: settings.apiKey,
            jsonMode: true,
            systemInstruction: `Kamu adalah ${picker.name} di grup "${group.name}". Kepribadian: ${picker.personality}.
Kembalikan JSON: { "scenePrompt": "deskripsi foto visual dalam bahasa Inggris sesuai suasana grup/aktivitasmu", "caption": "pesan singkat tanpa narasi" }`,
            prompt: `Kirim foto ke grup ${group.name} sekarang.`
          });
          const parsed = JSON.parse(raw);
          const scenePrompt = parsed.scenePrompt || `casual group hang out POV photo taken by ${picker.name}`;
          const newMsg = {
            id: `gm-pap-${Date.now()}`,
            senderId: picker.id,
            senderName: picker.name,
            text: (parsed.caption || '').replace(/\*[^*]+\*/g, '').trim(),
            image: buildCharacterImageUrl(picker, scenePrompt),
            imagePrompt: scenePrompt,
            timestamp: Date.now()
          };
          onUpdateGroup({ ...group, messages: [...(group.messages || []), newMsg] });
        } catch {
          showToast('Gagal membuat foto grup.');
        } finally {
          setTypingMember(null);
        }
      };

      const handleRegenerateGroupPhoto = (msgId) => {
        onUpdateGroup({
          ...group,
          messages: (group.messages || []).map((m) => {
            if (m.id !== msgId || !m.imagePrompt) return m;
            const senderChar = characters.find((c) => c.id === m.senderId);
            return {
              ...m,
              image: buildCharacterImageUrl(senderChar, m.imagePrompt, Math.floor(Math.random() * 9999999))
            };
          })
        });
      };

      const handleTriggerCrossChatDM = async () => {
        if (members.length === 0) return;
        const chosen = members[Math.floor(Math.random() * members.length)];
        showToast(`Meminta ${chosen.name} mengirim DM...`);
        try {
          const recentGrp = (group.messages || []).slice(-8).map((m) => `${m.senderName}: ${m.text}`).join('\n');
          const dmReply = await callGeminiAPI({
            apiKey: settings.apiKey,
            systemInstruction: `Kamu adalah ${chosen.name}. Kamu baru saja membaca obrolan di grup "${group.name}" dan ingin mengirim pesan pribadi (DM) langsung ke ${userPersona.name} untuk membahas hal yang terjadi di grup tadi. TANPA narasi.`,
            prompt: `Obrolan grup tadi:\n${recentGrp}\n\nTulis 1 pesan DM pribadi untuk ${userPersona.name}:`
          });
          onTriggerPrivateDM(chosen.id, dmReply.replace(/\*[^*]+\*/g, '').trim(), `Obrolan grup ${group.name}: ${recentGrp.slice(0, 120)}`);
        } catch {
          showToast('Gagal memicu DM dari grup.');
        }
      };

      const filteredMentionMembers =
        mentionQuery !== null
          ? members.filter((m) => m.name.toLowerCase().includes(mentionQuery))
          : [];

      return (
        <div className={`fixed inset-0 z-40 flex justify-center ${isDarkMode ? 'bg-[#121117] text-white' : 'bg-[#F6F5FA] text-gray-900'}`}>
          <div className="w-full max-w-md flex flex-col h-full relative">
            <div className={`px-3 py-3 border-b flex items-center justify-between ${isDarkMode ? 'bg-[#16151D] border-white/10' : 'bg-white border-gray-200'}`}>
              <div className="flex items-center gap-2 min-w-0">
                <button onClick={onBack} className="p-1.5 rounded-full hover:bg-white/10">
                  <ChevronLeft className="w-5 h-5" />
                </button>
                <div className="min-w-0">
                  <h2 className="font-bold text-sm truncate">{group.name}</h2>
                  <div className="flex items-center gap-1.5 overflow-x-auto text-[10px] text-gray-400">
                    {members.map((m) => (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => insertMention(m.name)}
                        className="hover:underline shrink-0"
                        style={{ color: activeTheme.primary }}
                      >
                        @{m.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1">
                <button
                  onClick={handleRequestGroupPhoto}
                  title="Minta Foto Grup"
                  className="p-2 rounded-full hover:bg-white/10"
                  style={{ color: activeTheme.primary }}
                >
                  <Camera className="w-4 h-4" />
                </button>
                <button
                  onClick={handleTriggerCrossChatDM}
                  title="Minta Karakter DM Soal Ini"
                  className="px-2.5 py-1.5 rounded-full text-[10px] font-bold"
                  style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}
                >
                  DM Ini
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto overflow-x-hidden p-3.5 space-y-3">
              {(group.messages || []).map((msg) => {
                const isUser = msg.senderId === 'user';
                const senderChar = characters.find((c) => c.id === msg.senderId);
                return (
                  <div
                    id={`gmsg-${msg.id}`}
                    key={msg.id}
                    onTouchStart={(e) => { touchStartX.current = e.touches[0].clientX; }}
                    onTouchEnd={(e) => {
                      if (e.changedTouches[0].clientX - touchStartX.current > 60) {
                        setReplyTo(msg);
                        inputRef.current?.focus();
                      }
                    }}
                    className={`flex items-end gap-2 transition-all rounded-2xl ${isUser ? 'justify-end' : 'justify-start'} ${highlightedId === msg.id ? 'ring-2 ring-amber-400 p-1' : ''}`}
                  >
                    {!isUser && (
                      <img
                        src={senderChar?.avatar || 'https://api.dicebear.com/9.x/adventurer/svg?seed=Member'}
                        alt={msg.senderName}
                        onClick={() => insertMention(msg.senderName)}
                        className="w-7 h-7 rounded-full object-cover shrink-0 mb-1 cursor-pointer"
                      />
                    )}

                    <div className={`max-w-[78%] min-w-0 space-y-1 flex flex-col ${isUser ? 'items-end' : 'items-start'}`}>
                      {!isUser && (
                        <button
                          type="button"
                          onClick={() => insertMention(msg.senderName)}
                          className="text-[10px] font-bold px-1 hover:underline"
                          style={{ color: activeTheme.primary }}
                        >
                          {msg.senderName}
                        </button>
                      )}

                      {msg.sticker ? (
                        <div className="p-1.5">
                          {msg.sticker.image ? (
                            <img src={msg.sticker.image} alt={msg.sticker.label} className="w-24 h-24 object-contain" />
                          ) : (
                            <div className={`w-24 h-24 rounded-3xl bg-gradient-to-br ${msg.sticker.bg} flex flex-col items-center justify-center border border-white/10`}>
                              <span className="text-4xl">{msg.sticker.emoji}</span>
                              <span className="text-[10px] font-bold mt-1">{msg.sticker.label}</span>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div
                          className={`px-3.5 py-2 rounded-2xl text-xs leading-relaxed whitespace-pre-wrap break-words [overflow-wrap:anywhere] overflow-hidden ${isUser ? 'text-white' : isDarkMode ? 'bg-[#1C1A24]' : 'bg-white border border-gray-200'}`}
                          style={isUser ? { backgroundColor: activeTheme.bubbleBg, color: activeTheme.bubbleText } : {}}
                        >
                          {msg.replyTo && (
                            <div
                              onClick={() => scrollToMessage(msg.replyTo.id)}
                              className="mb-1.5 rounded-lg border-l-4 border-white/60 bg-black/20 px-2.5 py-1 text-[11px] cursor-pointer overflow-hidden"
                            >
                              <p className="font-bold truncate">{msg.replyTo.senderName}</p>
                              <p className="opacity-80 line-clamp-3 break-words [overflow-wrap:anywhere]">{msg.replyTo.text}</p>
                            </div>
                          )}
                          {msg.image && (
                            msg.imagePrompt ? (
                              <AIImageCard
                                src={msg.image}
                                caption={msg.text || msg.imagePrompt}
                                onRegenerate={() => handleRegenerateGroupPhoto(msg.id)}
                                onOpenLightbox={() => setLightboxMsgId(msg.id)}
                              />
                            ) : (
                              <img
                                src={msg.image}
                                alt="Lampiran"
                                onClick={() => setLightboxMsgId(msg.id)}
                                className="w-full max-h-52 object-cover rounded-xl mb-1.5 cursor-pointer"
                              />
                            )
                          )}
                          {renderMessageWithHighlights(msg.text, isUser ? '#FDE68A' : activeTheme.primary)}
                        </div>
                      )}

                      <div className={`flex items-center gap-2 px-1 text-[10px] text-gray-400 ${isUser ? 'flex-row-reverse' : ''}`}>
                        <span>{formatTimeShort(msg.timestamp)}</span>
                        <button
                          onClick={() => {
                            setReplyTo(msg);
                            inputRef.current?.focus();
                          }}
                          className="hover:text-white"
                        >
                          <Reply className="w-3 h-3" />
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}

              {typingMember && (
                <div className="flex items-center gap-2 text-xs text-gray-400">
                  <img src={typingMember.avatar} alt={typingMember.name} className="w-6 h-6 rounded-full object-cover" />
                  <span>{typingMember.name} sedang mengetik...</span>
                </div>
              )}

              {!typingMember && readByNames.length > 0 && (
                <p className="text-[10px] text-gray-500 text-right px-2">Dibaca oleh {readByNames.join(', ')}</p>
              )}

              <div className="flex justify-center pt-1">
                <button
                  disabled={Boolean(typingMember)}
                  onClick={() => runGroupResponses(group.messages || [])}
                  className="px-3.5 py-1.5 rounded-full text-[11px] font-semibold border border-white/10 text-gray-400 hover:text-white"
                >
                  Lanjutkan Obrolan Karakter
                </button>
              </div>
              <div ref={bottomRef} />
            </div>

            {mentionQuery !== null && filteredMentionMembers.length > 0 && (
              <div className={`mx-3 mb-1 rounded-2xl border shadow-xl overflow-hidden ${isDarkMode ? 'bg-[#1C1A24] border-white/15' : 'bg-white border-gray-200'}`}>
                {filteredMentionMembers.map((m) => (
                  <button
                    key={m.id}
                    type="button"
                    onClick={() => insertMention(m.name, true)}
                    className="w-full px-3.5 py-2 flex items-center gap-2.5 text-left text-xs hover:bg-white/10"
                  >
                    <img src={m.avatar} alt={m.name} className="w-6 h-6 rounded-full object-cover" />
                    <span className="font-bold">@{m.name}</span>
                  </button>
                ))}
              </div>
            )}

            <StickerAndAttachmentBar
              inputText={inputText}
              setInputText={setInputText}
              onSendMessage={handleSendGroupMessage}
              customStickers={customStickers}
              onAddCustomSticker={onAddCustomSticker}
              replyTo={replyTo}
              onCancelReply={() => setReplyTo(null)}
              activeTheme={activeTheme}
              isDarkMode={isDarkMode}
              placeholder="Ketik @ untuk mention anggota..."
              onInputChangeExtra={handleInputMentionDetect}
              inputRef={inputRef}
            />

            <ImageLightboxModal
              lightboxData={(() => {
                const target = (group.messages || []).find((m) => m.id === lightboxMsgId);
                if (!target?.image) return null;
                return {
                  src: target.image,
                  caption: target.text || target.imagePrompt,
                  authorName: target.senderName
                };
              })()}
              activeTheme={activeTheme}
              onClose={() => setLightboxMsgId(null)}
              onRegenerate={(() => {
                const target = (group.messages || []).find((m) => m.id === lightboxMsgId);
                return target?.imagePrompt ? () => handleRegenerateGroupPhoto(target.id) : null;
              })()}
            />
          </div>
        </div>
      );
    }

    function CharacterProfileScreen({
      char, diaryCount, activeTheme, isDarkMode,
      onBack, onStartChat, onOpenDiary, onOpenPhone, onEdit, onDelete
    }) {
      if (!char) return null;
      return (
        <div className={`fixed inset-0 z-40 flex justify-center ${isDarkMode ? 'bg-[#121117] text-white' : 'bg-[#F6F5FA] text-gray-900'}`}>
          <div className="w-full max-w-md flex flex-col h-full">
            <div className="px-4 py-3.5 border-b border-white/10 flex items-center justify-between">
              <button onClick={onBack} className="p-1.5 rounded-full hover:bg-white/10">
                <ChevronLeft className="w-5 h-5" />
              </button>
              <h2 className="font-bold text-base">Profil Karakter</h2>
              <div className="flex items-center gap-1">
                <button onClick={onEdit} className="p-2 rounded-full hover:bg-white/10">
                  <Edit3 className="w-4 h-4" />
                </button>
                <button onClick={onDelete} className="p-2 rounded-full hover:bg-white/10 text-rose-400">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-5 space-y-5">
              <div className="flex flex-col items-center text-center space-y-2">
                <img src={char.avatar} alt={char.name} className="w-24 h-24 rounded-full object-cover border-2" style={{ borderColor: activeTheme.primary }} />

                <span className="text-xs px-3 py-1 rounded-full font-semibold" style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}>
