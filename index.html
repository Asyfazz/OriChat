    function CharacterPhoneScreen({
      char, allCharacters, chatData, groups, userPersona, apiKey,
      phoneHistory, onSaveSnapshot, activeTheme, isDarkMode, onBack, showToast
    }) {
      const [selectedCharId, setSelectedCharId] = useState(char?.id || allCharacters[0]?.id);
      const [activeSnapshot, setActiveSnapshot] = useState(null);
      const [phoneApp, setPhoneApp] = useState('home');
      const [selectedContact, setSelectedContact] = useState(null);
      const [selectedPhoto, setSelectedPhoto] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      const targetChar = allCharacters.find((c) => c.id === selectedCharId) || allCharacters[0];
      if (!targetChar) return null;

      const generatePhoneSnapshot = async () => {
        setIsGenerating(true);
        try {
          const recentChat = (chatData?.messages || []).slice(-6).map((m) => m.text).filter(Boolean).join(' | ');
          const raw = await callGeminiAPI({
            apiKey,
            jsonMode: true,
            systemInstruction: `Kamu adalah generator isi ponsel pribadi untuk karakter "${targetChar.name}".
Kepribadian & Kebiasaan: ${targetChar.personality}
Pengguna bernama: ${userPersona.name}.

ATURAN JUMLAH DINAMIS SESUAI SIFAT KARAKTER:
- messages: jika karakter ekstrovert/bawel/sosial buat 5-8 kontak; jika introvert/cuek/dingin buat 1-2 kontak saja.
- gallery: jika suka memotret/estetik buat 6-9 foto; jika cuek/praktis buat 1-2 foto saja.
- notes: jika perfeksionis/sibuk/overthinker buat 4-6 catatan; jika santai/malas mencatat buat 0-1 catatan.
- browser: jika kepo/kutu buku/gamer buat 6-10 riwayat; jika jarang browsing buat 1-3 riwayat.

Kembalikan JSON valid dengan format:
{
  "messages": [{ "contactName": "Nama", "time": "Hari ini 09.15", "preview": "pesan terakhir", "thread": [{ "from": "Nama", "text": "isi" }, { "from": "${targetChar.name}", "text": "balasan" }] }],
  "browser": [{ "group": "Hari ini", "query": "kata kunci", "snippet": "judul halaman", "time": "23 November · 13.10" }],
  "notes": [{ "date": "23 November · 08.12", "title": "Judul", "content": "Isi catatan" }],
  "gallery": [{ "emoji": "🐱", "bg": "from-amber-700/50 to-stone-900", "description": "Deskripsi visual foto", "date": "23/11/2026, 13.30", "secretNote": "Catatan singkat isi hati karakter tentang foto ini" }]
}`,
            prompt: `Obrolan terbaru dengan ${userPersona.name}: ${recentChat || 'Baru saling menyapa'}. Buat isi ponsel ${targetChar.name} sekarang.`
          });

          const parsed = JSON.parse(raw);
          const now = new Date();
          const snapshot = {
            id: `phone-${Date.now()}`,
            characterId: targetChar.id,
            characterName: targetChar.name,
            characterAvatar: targetChar.avatar,
            unlockedTime: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
            unlockedDate: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
            data: {
              messages: parsed.messages || [],
              browser: parsed.browser || [],
              notes: parsed.notes || [],
              gallery: parsed.gallery || []
            }
          };
          onSaveSnapshot(snapshot);
          setActiveSnapshot(snapshot);
          setPhoneApp('home');
          showToast(`Ponsel ${targetChar.name} berhasil dibuka!`);
        } catch {
          showToast('Gagal memuat isi ponsel. Pastikan API Key aktif.');
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-[#0D0C12] text-white flex justify-center">
          <div className="w-full max-w-md flex flex-col h-full">
            <div className="px-4 py-3.5 border-b border-white/10 flex items-center justify-between">
              <button
                onClick={() => {
                  if (selectedContact) { setSelectedContact(null); return; }
                  if (selectedPhoto) { setSelectedPhoto(null); return; }
                  if (activeSnapshot && phoneApp !== 'home') { setPhoneApp('home'); return; }
                  if (activeSnapshot) { setActiveSnapshot(null); return; }
                  onBack();
                }}
                className="flex items-center gap-1 text-xs text-gray-300 hover:text-white"
              >
                <ChevronLeft className="w-5 h-5" /> Kembali
              </button>
              <span className="text-xs font-bold">Ponsel {targetChar.name}</span>
              <button
                onClick={() => { setActiveSnapshot(null); setPhoneApp('history'); }}
                className="text-[11px] font-semibold"
                style={{ color: activeTheme.primary }}
              >
                Riwayat ({phoneHistory.length})
              </button>
            </div>

            {!activeSnapshot && phoneApp !== 'history' && (
              <div className="flex-1 p-6 flex flex-col items-center justify-center text-center space-y-5">
                <div className="flex gap-2 overflow-x-auto max-w-full pb-2">
                  {allCharacters.map((c) => (
                    <button
                      key={c.id}
                      onClick={() => setSelectedCharId(c.id)}
                      className={`px-3 py-1.5 rounded-full text-xs font-semibold border ${selectedCharId === c.id ? 'text-white border-transparent' : 'border-white/15 text-gray-400'}`}
                      style={selectedCharId === c.id ? { backgroundColor: activeTheme.primary } : {}}
                    >
                      {c.name}
                    </button>
                  ))}
                </div>

                <img src={targetChar.avatar} alt={targetChar.name} className="w-20 h-20 rounded-full object-cover border-2" style={{ borderColor: activeTheme.primary }} />
                <div>
                  <p className="text-[11px] tracking-widest uppercase" style={{ color: activeTheme.primary }}>CHARACTER PHONE · GRATIS</p>
                  <h2 className="text-xl font-bold mt-1">Lihat ponsel {targetChar.name}?</h2>
                  <p className="text-xs text-gray-400 mt-2 max-w-xs">
                    Setiap kali dilihat, konten baru dibuat menyesuaikan sifat {targetChar.name}. Lihat kembali riwayat kapan saja secara gratis.
                  </p>
                </div>

                <button
                  disabled={isGenerating}
                  onClick={generatePhoneSnapshot}
                  className="w-full max-w-xs py-3.5 rounded-2xl text-sm font-bold text-white shadow-lg"
                  style={{ backgroundColor: activeTheme.primary }}
                >
                  {isGenerating ? 'Membuka kunci ponsel...' : 'Buat & lihat · Gratis'}
                </button>

                <button
                  onClick={() => setPhoneApp('history')}
                  className="text-xs text-gray-400 underline"
                >
                  Lihat riwayat ponsel ({phoneHistory.length})
                </button>
              </div>
            )}

            {!activeSnapshot && phoneApp === 'history' && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <h2 className="text-xl font-bold">Riwayat ponsel</h2>
                <p className="text-xs text-gray-400">Total {phoneHistory.length} kali dilihat</p>
                {phoneHistory.length === 0 ? (
                  <p className="text-xs text-gray-500 text-center py-8">Belum ada riwayat ponsel yang dibuka.</p>
                ) : (
                  phoneHistory.map((snap) => (
                    <div
                      key={snap.id}
                      onClick={() => { setActiveSnapshot(snap); setPhoneApp('home'); }}
                      className="p-3.5 rounded-2xl bg-[#1C202B] border border-white/10 flex items-center justify-between cursor-pointer"
                    >
                      <div className="flex items-center gap-3">
                        <img src={snap.characterAvatar} alt="" className="w-10 h-10 rounded-full object-cover" />
                        <div>
                          <p className="font-bold text-sm">Ponsel {snap.characterName}</p>
                          <p className="text-[11px] text-gray-400">{snap.unlockedDate} · Dibuka pukul {snap.unlockedTime}</p>
                        </div>
                      </div>
                      <ChevronRight className="w-4 h-4 text-gray-400" />
                    </div>
                  ))
                )}
              </div>
            )}

            {activeSnapshot && phoneApp === 'home' && (
              <div className="flex-1 p-6 flex flex-col justify-between bg-gradient-to-b from-[#171923] to-[#0D0C12]">
                <div className="text-center pt-6 space-y-1">
                  <div className="text-5xl font-light tracking-tight">{activeSnapshot.unlockedTime}</div>
                  <p className="text-xs text-gray-400">{activeSnapshot.unlockedDate}</p>
                </div>

                <div className="grid grid-cols-3 gap-5 pb-10">
                  {[
                    { id: 'wallet', label: 'Dompet', icon: <Wallet className="w-6 h-6" />, disabled: true },
                    { id: 'notes', label: `Catatan (${activeSnapshot.data.notes.length})`, icon: <FileText className="w-6 h-6" /> },
                    { id: 'screentime', label: 'Waktu layar', icon: <Hourglass className="w-6 h-6" />, disabled: true },
                    { id: 'browser', label: `Browser (${activeSnapshot.data.browser.length})`, icon: <Search className="w-6 h-6" /> },
                    { id: 'gallery', label: `Galeri (${activeSnapshot.data.gallery.length})`, icon: <ImageIcon className="w-6 h-6" /> },
                    { id: 'messages', label: `Pesan (${activeSnapshot.data.messages.length})`, icon: <MessageCircle className="w-6 h-6" /> }
                  ].map((app) => (
                    <button
                      key={app.id}
                      onClick={() => {
                        if (app.disabled) {
                          showToast(`${app.label} bersifat pribadi.`);
                          return;
                        }
                        setPhoneApp(app.id);
                      }}
                      className="flex flex-col items-center gap-2 group"
                    >
                      <div className="w-16 h-16 rounded-2xl bg-[#1F2330] border border-white/10 flex items-center justify-center text-gray-200 group-hover:scale-105 transition shadow-lg">
                        {app.icon}
                      </div>
                      <span className="text-[11px] text-gray-300 text-center leading-tight">{app.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {activeSnapshot && phoneApp === 'messages' && !selectedContact && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold">Pesan</h2>
                  <span className="text-xs text-gray-400">Percakapan: {activeSnapshot.data.messages.length}</span>
                </div>
                {activeSnapshot.data.messages.map((msgItem, idx) => (
                  <div
                    key={idx}
                    onClick={() => setSelectedContact(msgItem)}
                    className="p-3.5 rounded-2xl bg-[#1C202B] flex items-center justify-between cursor-pointer"
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-sm shrink-0">
                        {msgItem.contactName?.[0] || '?'}
                      </div>
                      <div className="min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <p className="font-bold text-sm truncate">{msgItem.contactName}</p>
                          <span className="text-[10px] text-gray-400 shrink-0">{msgItem.time}</span>
                        </div>
                        <p className="text-xs text-gray-400 truncate mt-0.5">{msgItem.preview}</p>
                      </div>
                    </div>
                    <ChevronRight className="w-4 h-4 text-gray-400 shrink-0" />
                  </div>
                ))}
              </div>
            )}

            {activeSnapshot && phoneApp === 'messages' && selectedContact && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <h3 className="font-bold text-base border-b border-white/10 pb-2">{selectedContact.contactName}</h3>
                {(selectedContact.thread || []).map((t, i) => {
                  const isOwner = t.from === activeSnapshot.characterName;
                  return (
                    <div key={i} className={`flex flex-col ${isOwner ? 'items-end' : 'items-start'}`}>
                      <span className="text-[10px] text-gray-400 mb-0.5">{t.from}</span>
                      <div
                        className={`px-3.5 py-2 rounded-2xl text-xs max-w-[80%] ${isOwner ? 'text-white' : 'bg-[#1C202B]'}`}
                        style={isOwner ? { backgroundColor: activeTheme.bubbleBg } : {}}
                      >
                        {t.text}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {activeSnapshot && phoneApp === 'browser' && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <h2 className="text-2xl font-bold">Browser</h2>
                <div className="px-3.5 py-2.5 rounded-2xl bg-[#1C202B] text-xs text-gray-400 flex items-center gap-2">
                  <Search className="w-4 h-4" /> Cari atau masukkan alamat situs
                </div>
                {activeSnapshot.data.browser.map((b, i) => (
                  <div key={i} className="p-3.5 rounded-2xl bg-[#1C202B] flex items-start gap-3">
                    <div className="p-2 rounded-xl bg-white/5 mt-0.5">
                      <Search className="w-4 h-4 text-gray-300" />
                    </div>
                    <div className="min-w-0">
                      <p className="font-bold text-sm">{b.query}</p>
                      <p className="text-[11px] text-gray-400 mt-0.5">{b.snippet} · {b.time}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeSnapshot && phoneApp === 'notes' && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold">Catatan</h2>
                  <span className="text-xs text-gray-400">Total: {activeSnapshot.data.notes.length}</span>
                </div>
                {activeSnapshot.data.notes.length === 0 ? (
                  <p className="text-xs text-gray-500 text-center py-10">Tidak ada catatan tersimpan.</p>
                ) : (
                  activeSnapshot.data.notes.map((n, i) => (
                    <div key={i} className="p-4 rounded-2xl bg-[#1C202B] space-y-1">
                      <p className="text-[10px] text-gray-400">{n.date}</p>
                      <h4 className="font-bold text-sm">{n.title}</h4>
                      <p className="text-xs text-gray-300 leading-relaxed whitespace-pre-line">{n.content}</p>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeSnapshot && phoneApp === 'gallery' && !selectedPhoto && (
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold">Galeri</h2>
                  <span className="text-xs text-gray-400">{activeSnapshot.data.gallery.length} foto</span>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {activeSnapshot.data.gallery.map((g, i) => (
                    <button
                      key={i}
                      onClick={() => setSelectedPhoto(g)}
                      className={`aspect-square rounded-2xl bg-gradient-to-br ${g.bg || 'from-purple-900/40 to-slate-900'} border border-white/10 flex items-center justify-center text-4xl`}
                    >
                      {g.emoji || '📷'}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {activeSnapshot && phoneApp === 'gallery' && selectedPhoto && (
              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                <div className={`w-full aspect-square rounded-3xl bg-gradient-to-br ${selectedPhoto.bg || 'from-amber-800/40 to-stone-900'} flex items-center justify-center text-7xl border border-white/10`}>
                  {selectedPhoto.emoji || '📷'}
                </div>
                <div className="space-y-1">
                  <p className="text-xs leading-relaxed">{selectedPhoto.description}</p>
                  <p className="text-[11px] text-gray-400">{selectedPhoto.date}</p>
                </div>
                <div className="p-4 rounded-2xl bg-[#1C202B] space-y-2">
                  <div className="flex items-center gap-2">
                    <img src={activeSnapshot.characterAvatar} alt="" className="w-6 h-6 rounded-full object-cover" />
                    <span className="text-[11px] text-gray-400 font-semibold">Catatan singkat</span>
                  </div>
                  <p className="text-xs leading-relaxed">{selectedPhoto.secretNote}</p>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DiaryCollectionScreen({
      characters, diaries, initialCharId, chats, userPersona, apiKey,
      activeTheme, isDarkMode, onBack, onAddDiary, showToast
    }) {
      const [selectedCharId, setSelectedCharId] = useState(initialCharId);
      const [entryIndex, setEntryIndex] = useState(0);
      const [showCalendar, setShowCalendar] = useState(false);
      const [isWriting, setIsWriting] = useState(false);

      const selectedChar = characters.find((c) => c.id === selectedCharId);
      const charDiaries = diaries.filter((d) => d.characterId === selectedCharId);
      const currentEntry = charDiaries[entryIndex] || charDiaries[0];

      const handleWriteTodayDiary = async () => {
        if (!selectedChar) return;
        setIsWriting(true);
        const recentChat = (chats[selectedChar.id]?.messages || []).slice(-6).map((m) => m.text).filter(Boolean).join(' | ');
        await generateDiaryEntryForChar({
          char: selectedChar,
          contextSummary: recentChat,
          userPersona,
          apiKey,
          onSuccess: (entry) => {
            onAddDiary(entry);
            setEntryIndex(0);
            showToast(`Entri diari baru ${selectedChar.name} tertulis!`);
          }
        });
        setIsWriting(false);
      };

      return (
        <div className={`fixed inset-0 z-40 flex justify-center ${isDarkMode ? 'bg-[#121117] text-white' : 'bg-[#F6F5FA] text-gray-900'}`}>
          <div className="w-full max-w-md flex flex-col h-full">
            <div className="px-4 py-3.5 border-b border-white/10 flex items-center justify-between">
              <button
                onClick={() => {
                  if (selectedCharId && !initialCharId) {
                    setSelectedCharId(null);
                    setShowCalendar(false);
                  } else {
                    onBack();
                  }
                }}
                className="p-1.5 rounded-full hover:bg-white/10"
              >
                <ChevronLeft className="w-5 h-5" />
              </button>
              <h2 className="font-bold text-base">
                {selectedChar ? `Diari ${selectedChar.name}` : 'Koleksi Buku Harian'}
              </h2>
              {selectedChar ? (
                <button onClick={() => setShowCalendar(!showCalendar)} className="p-1.5 rounded-full hover:bg-white/10">
                  <Calendar className="w-5 h-5" style={{ color: activeTheme.primary }} />
                </button>
              ) : (
                <div className="w-8" />
              )}
            </div>

            {!selectedChar ? (
              <div className="p-5 grid grid-cols-3 gap-3.5 overflow-y-auto">
                {characters.map((c, idx) => {
                  const preset = THEME_PRESETS[idx % THEME_PRESETS.length];
                  return (
                    <button
                      key={c.id}
                      onClick={() => { setSelectedCharId(c.id); setEntryIndex(0); }}
                      className="aspect-[3/4] rounded-2xl p-3 flex flex-col items-center justify-center gap-2.5 text-white shadow-lg border-2 border-dashed border-white/30 transition hover:scale-105"
                      style={{ background: preset.bookCover }}
                    >
                      <img src={c.avatar} alt={c.name} className="w-14 h-14 rounded-full object-cover border-2 border-white/80" />
                      <span className="font-bold text-xs truncate max-w-full">{c.name}</span>
                    </button>
                  );
                })}
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto p-4 flex flex-col justify-between space-y-4">
                {showCalendar && (
                  <div className={`p-4 rounded-3xl border space-y-3 ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200'}`}>
                    <p className="text-center font-bold text-xs">Kalender Diari · Semua Terbuka Gratis</p>
                    <div className="grid grid-cols-7 gap-1.5 text-center text-[11px]">
                      {Array.from({ length: 30 }, (_, i) => i + 1).map((dayNum) => {
                        const padDay = String(dayNum).padStart(2, '0');
                        const foundIdx = charDiaries.findIndex((d) => d.displayDay === padDay);
                        const hasEntry = foundIdx !== -1;
                        return (
                          <button
                            key={dayNum}
                            onClick={() => {
                              if (hasEntry) {
                                setEntryIndex(foundIdx);
                                setShowCalendar(false);
                              }
                            }}
                            className={`h-8 rounded-full flex items-center justify-center font-semibold ${hasEntry ? 'text-white' : 'text-gray-500'}`}
                            style={hasEntry ? { backgroundColor: activeTheme.primary } : {}}
                          >
                            {dayNum}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {currentEntry ? (
                  <div className={`flex-1 rounded-3xl p-5 border space-y-4 ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200'}`}>
                    <div>
                      <div className="text-3xl font-bold">{currentEntry.displayDay}</div>
                      <p className="text-[11px] text-gray-400">{currentEntry.fullTimestamp}</p>
                    </div>
                    <p className="text-xs leading-relaxed whitespace-pre-line">{currentEntry.content}</p>
                  </div>
                ) : (
                  <div className="flex-1 flex items-center justify-center text-xs text-gray-400">
                    Belum ada catatan diari untuk {selectedChar.name}.
                  </div>
                )}

                <div className="space-y-2.5">
                  <button
                    disabled={isWriting}
                    onClick={handleWriteTodayDiary}
                    className="w-full py-2.5 rounded-2xl text-xs font-bold text-white"
                    style={{ backgroundColor: activeTheme.primary }}
                  >
                    {isWriting ? 'Menulis diari...' : 'Tulis Entri Diari Hari Ini'}
                  </button>

                  {charDiaries.length > 0 && (
                    <div className="flex items-center justify-center gap-6 text-xs font-semibold">
                      <button
                        disabled={entryIndex <= 0}
                        onClick={() => setEntryIndex((i) => Math.max(0, i - 1))}
                        className="p-1.5 disabled:opacity-30"
                      >
                        <ChevronLeft className="w-4 h-4" />
                      </button>
                      <span>{entryIndex + 1} / {charDiaries.length}</span>
                      <button
                        disabled={entryIndex >= charDiaries.length - 1}
                        onClick={() => setEntryIndex((i) => Math.min(charDiaries.length - 1, i + 1))}
                        className="p-1.5 disabled:opacity-30"
                      >
                        <ChevronRight className="w-4 h-4" />
                      </button>
                    </div>
                  )}
                </div>
              </div>

    function App() {
      const loadState = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      };

      const [characters, setCharacters] = useState(() => loadState('orichat_characters', INITIAL_CHARACTERS));

      const [posts, setPosts] = useState(() => loadState('orichat_posts', INITIAL_POSTS));
      const [diaries, setDiaries] = useState(() => loadState('orichat_diaries', INITIAL_DIARIES));
      const [phoneHistory, setPhoneHistory] = useState(() => loadState('orichat_phone_history', []));
      const [customStickers, setCustomStickers] = useState(() => loadState('orichat_custom_stickers', []));
      const [userPersona, setUserPersona] = useState(() =>
        loadState('orichat_user_persona', {
          name: 'Kamu',
          avatar: 'https://api.dicebear.com/9.x/adventurer/svg?seed=UserOri&backgroundColor=c0aede',
          bio: 'Pengguna pribadi OriChat yang suka ngobrol santai.'
        })
      );
      const [settings, setSettings] = useState(() =>
        loadState('orichat_settings', {
          apiKey: '',
          themeId: 'mekar-malam',
          customColor: '#B794F4',
          colorMode: 'dark',
          pin: '',
          hideOnlineStatus: false
        })
      );

      const [activeTab, setActiveTab] = useState('beranda');
      const [berandaSubTab, setBerandaSubTab] = useState('feed');
      const [activeScreen, setActiveScreen] = useState(null);
      const [toastMsg, setToastMsg] = useState('');
      const [isLocked, setIsLocked] = useState(() => Boolean(loadState('orichat_settings', {}).pin));
      const [pinAttempt, setPinAttempt] = useState('');
      const [presenceContext, setPresenceContext] = useState({ type: null, summary: '', offlineMs: 0 });
      const presenceTriggeredRef = useRef(false);

      // PWA Installation & Offline Support States
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isStandalonePwa, setIsStandalonePwa] = useState(() =>
        Boolean(window.matchMedia?.('(display-mode: standalone)')?.matches || window.navigator?.standalone)
      );
      const [showPwaGuideModal, setShowPwaGuideModal] = useState(false);

      useEffect(() => { localStorage.setItem('orichat_characters', JSON.stringify(characters)); }, [characters]);
      useEffect(() => { localStorage.setItem('orichat_chats', JSON.stringify(chats)); }, [chats]);
      useEffect(() => { localStorage.setItem('orichat_groups', JSON.stringify(groups)); }, [groups]);
      useEffect(() => { localStorage.setItem('orichat_posts', JSON.stringify(posts)); }, [posts]);
      useEffect(() => { localStorage.setItem('orichat_diaries', JSON.stringify(diaries)); }, [diaries]);
      useEffect(() => { localStorage.setItem('orichat_phone_history', JSON.stringify(phoneHistory)); }, [phoneHistory]);
      useEffect(() => { localStorage.setItem('orichat_custom_stickers', JSON.stringify(customStickers)); }, [customStickers]);
      useEffect(() => { localStorage.setItem('orichat_user_persona', JSON.stringify(userPersona)); }, [userPersona]);
      useEffect(() => { localStorage.setItem('orichat_settings', JSON.stringify(settings)); }, [settings]);

      useEffect(() => {
        document.title = 'OriChat — AI Companion & Roleplay';
      }, []);

      // Setup Dynamic PWA Manifest, Icons, Service Worker & beforeinstallprompt
      useEffect(() => {
        const buildOriChatSvgIcon = (size) => {
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1E1B2E"/>
                <stop offset="100%" stop-color="#111116"/>
              </linearGradient>
              <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#C4B5FD"/>
                <stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
            <path d="M136 164c0-35.3 28.7-64 64-64h112c35.3 0 64 28.7 64 64v120c0 35.3-28.7 64-64 64h-74l-56 48c-8.2 7-20.8 1.2-20.8-9.6V348H200c-35.3 0-64-28.7-64-64V164z" fill="url(#accentGrad)"/>
            <circle cx="212" cy="224" r="18" fill="#111116"/>
            <circle cx="256" cy="224" r="18" fill="#111116"/>
            <circle cx="300" cy="224" r="18" fill="#111116"/>
          </svg>`;
          return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        };

        const icon192 = buildOriChatSvgIcon(192);
        const icon512 = buildOriChatSvgIcon(512);

        let appleTouch = document.querySelector('link[rel="apple-touch-icon"]');
        if (!appleTouch) {
          appleTouch = document.createElement('link');
          appleTouch.setAttribute('rel', 'apple-touch-icon');
          document.head.appendChild(appleTouch);
        }
        appleTouch.setAttribute('href', icon192);

        const manifestPayload = {
          name: 'OriChat',
          short_name: 'OriChat',
          description: 'AI Companion & Character Roleplay Pribadi',
          display: 'standalone',
          orientation: 'portrait',
          theme_color: '#111116',
          background_color: '#111116',
          start_url: window.location.href,
          scope: './',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
            { src: icon512, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestPayload)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        let manifestLink = document.querySelector('link[rel="manifest"]');
        if (!manifestLink) {
          manifestLink = document.createElement('link');
          manifestLink.setAttribute('rel', 'manifest');
          document.head.appendChild(manifestLink);
        }
        manifestLink.setAttribute('href', manifestUrl);

        let swBlobUrl = null;
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'orichat-standalone-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
              event.waitUntil(
                caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']).catch(() => {}))
              );
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                fetch(event.request)
                  .then((res) => {
                    if (res && res.status === 200 && res.type === 'basic') {
                      const clone = res.clone();
                      caches.open(CACHE_NAME).then((c) => c.put(event.request, clone)).catch(() => {});
                    }
                    return res;
                  })
                  .catch(() => caches.match(event.request).then((cached) => cached || caches.match('./')))
              );
            });
          `;
          try {
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            swBlobUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swBlobUrl).catch(() => {});
          } catch {
            // Ignore restricted environments
          }
        }

        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };

        const handleAppInstalled = () => {
          setDeferredPrompt(null);
          setIsStandalonePwa(true);
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        window.addEventListener('appinstalled', handleAppInstalled);

        return () => {
          URL.revokeObjectURL(manifestUrl);
          if (swBlobUrl) URL.revokeObjectURL(swBlobUrl);
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          window.removeEventListener('appinstalled', handleAppInstalled);
        };
      }, []);

      const handleInstallPwaClick = async () => {

      const showToast = (msg) => {

      };

      const triggerPresenceReactionForCharacter = async (targetCharId, eventType, customNote = '') => {
        if (settings.hideOnlineStatus || !settings.apiKey) return;
        const char = characters.find((c) => c.id === targetCharId);
        if (!char) return;

        const now = Date.now();
        const lastReactionAt = Number(localStorage.getItem('orichat_last_presence_reaction_at') || 0);
        if (now - lastReactionAt < PRESENCE_COOLDOWN_MS) return;
        localStorage.setItem('orichat_last_presence_reaction_at', String(now));

        const recentMsgs = (chats[char.id]?.messages || []).slice(-6);
        const recentStr = recentMsgs
          .map((m) => `${m.sender === 'user' ? userPersona.name : char.name}: ${m.text || '[Media]'}`)
          .join('\n');
        const saidGoodnight = recentMsgs.some(
          (m) => m.sender === 'user' && /\b(tidur|bobok|bobo|ngantuk|duluan|night|gn)\b/i.test(m.text || '')
        );

        const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        let situationDesc = '';
        if (eventType === 'late_night_online') {
          situationDesc = `Pengguna (${userPersona.name}) ketahuan baru saja membuka aplikasi & online tengah malam pada pukul ${timeStr} WIB.${
            saidGoodnight ? ' Padahal di chat terakhir pengguna sudah pamit mau tidur!' : ''
          } ${customNote}`;
        } else if (eventType === 'lurking_in_room') {
          situationDesc = `Pengguna (${userPersona.name}) membuka ruang obrolanmu dan diam melihat layar selama 12 detik tanpa mengetik pesan apa pun (pukul ${timeStr} WIB).`;
        } else {
          situationDesc = `Pengguna (${userPersona.name}) baru saja membuka aplikasi OriChat setelah offline selama ${customNote || 'beberapa waktu'} (sekarang pukul ${timeStr} WIB).`;
        }

        try {
          const reply = await callGeminiAPI({
            apiKey: settings.apiKey,
            systemInstruction: `Kamu adalah ${char.name}. Kepribadian: ${char.personality}.
Contoh gaya ketikmu:
${(char.sampleChats || []).join('\n')}

SITUASI ONLINE PRESENCE:
${situationDesc}

ATURAN:
1. Kirim 1 hingga 2 gelembung chat ponsel singkat (dipisah baris baru \\n) TANPA narasi tindakan atau tanda bintang.
2. Sesuaikan reaksimu dengan kepribadianmu:
   - Jika perhatian/cerewet/posesif: sapa antusias atau tegur karena baru muncul / begadang.
   - Jika dingin/cool/tsundere: sapa singkat atau pura-pura cuek padahal memperhatikan status online-nya.
3. Jangan terdengar seperti asisten AI.`,
            prompt: `Riwayat chat terakhir:\n${recentStr || '(Belum ada chat panjang)'}\n\nKirim reaksi singkat ${char.name}:`
          });

          const lines = reply
            .split('\n')
            .map((l) => l.replace(/\*[^*]+\*/g, '').trim())
            .filter(Boolean)
            .slice(0, 2);

          if (lines.length === 0) return;

          for (let i = 0; i < lines.length; i++) {
            await sleep(Math.min(1500, Math.max(700, lines[i].length * 25)));
            setChats((prev) => {
              const isCurrentlyOpen = activeScreen?.type === 'chat' && activeScreen.charId === char.id;
              return {
                ...prev,
                [char.id]: {
                  ...(prev[char.id] || { messages: [], meetRecaps: [] }),
                  unread: isCurrentlyOpen ? 0 : (prev[char.id]?.unread || 0) + 1,
                  messages: [
                    ...(prev[char.id]?.messages || []),
                    {
                      id: `presence-${Date.now()}-${i}`,
                      sender: 'ai',
                      text: lines[i],
                      timestamp: Date.now(),
                      type: 'chat'
                    }
                  ]
                }
              };
            });
          }
        } catch {
          // Ignore if API not ready
        }
      };

      useEffect(() => {
        const now = Date.now();
        const prevActiveAt = Number(localStorage.getItem('orichat_last_active_at') || 0);
        localStorage.setItem('orichat_last_app_opened_at', String(now));
        localStorage.setItem('orichat_last_active_at', String(now));

        const evaluatePresenceOnOpen = (offlineDurationMs) => {
          const currentNow = new Date();
          const lateNight = isLateNightHour(currentNow);
          const minsOffline = Math.floor(offlineDurationMs / 60000);

          let detectedType = null;
          let summary = '';

          if (lateNight) {
            detectedType = 'late_night_online';
            summary = `Pengguna baru membuka aplikasi pada jam larut malam (${formatTimeShort(Date.now())}).`;
          } else if (prevActiveAt > 0 && minsOffline >= 15) {
            detectedType = 'just_opened';
            summary = `Pengguna baru membuka aplikasi setelah offline selama ${formatOfflineDuration(offlineDurationMs)}.`;
          }

          if (detectedType) {
            setPresenceContext({ type: detectedType, summary, offlineMs: offlineDurationMs });

            if (!presenceTriggeredRef.current && !isLocked && !settings.hideOnlineStatus && characters.length > 0) {
              presenceTriggeredRef.current = true;
              const sortedByRecent = [...characters].sort((a, b) => {
                const aLast = chats[a.id]?.messages?.slice(-1)[0]?.timestamp || 0;
                const bLast = chats[b.id]?.messages?.slice(-1)[0]?.timestamp || 0;
                return bLast - aLast;
              });
              const targetChar = sortedByRecent[0];
              const durationText = prevActiveAt > 0 && minsOffline >= 15 ? formatOfflineDuration(offlineDurationMs) : '';

              setTimeout(() => {
                triggerPresenceReactionForCharacter(targetChar.id, detectedType, durationText);
              }, 1800);
            }
          }
        };

        evaluatePresenceOnOpen(prevActiveAt > 0 ? now - prevActiveAt : 0);

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'hidden') {
            localStorage.setItem('orichat_last_active_at', String(Date.now()));
          } else if (document.visibilityState === 'visible') {
            const lastHidden = Number(localStorage.getItem('orichat_last_active_at') || Date.now());
            const gap = Date.now() - lastHidden;
            localStorage.setItem('orichat_last_app_opened_at', String(Date.now()));
            localStorage.setItem('orichat_last_active_at', String(Date.now()));
            if (gap >= 15 * 60 * 1000 || isLateNightHour()) {
              evaluatePresenceOnOpen(gap);
            }
          }
        };

        const handleBeforeUnload = () => {
          localStorage.setItem('orichat_last_active_at', String(Date.now()));
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('beforeunload', handleBeforeUnload);
        };
      }, [isLocked, settings.hideOnlineStatus]);

      const isDarkMode = useMemo(() => {
        if (settings.colorMode === 'light') return false;

      }, [settings.colorMode]);

      const activeTheme = useMemo(() => {

          const newMsgs = lines.map((txt, idx) => ({

      const handleTriggerPrivateDM = (charId, dmText, memorySummary) => {

        setChats((prev) => ({

      const handlePublishPost = async (newPost) => {
        setPosts((prev) => [newPost, ...prev]);
        setActiveScreen(null);
        showToast('Postingan diterbitkan!');

        const audience =
          newPost.visibility === 'mentioned' && newPost.mentions.length > 0
            ? characters.filter((c) => newPost.mentions.includes(c.id))
            : characters;

        if (audience.length === 0) return;

        try {
          const charList = audience.map((c) => `${c.name}: ${c.personality.slice(0, 250)}`).join('\n');
          const raw = await callGeminiAPI({
            apiKey: settings.apiKey,
            jsonMode: true,
            imageBase64: newPost.image || null,
            systemInstruction: `Simulasikan reaksi karakter AI terhadap postingan media sosial baru dari ${userPersona.name}.
Karakter yang melihat:
${charList}
Kembalikan JSON: { "likes": ["NamaKarakter"], "comments": [{ "authorName": "NamaKarakter", "text": "komentar chat kasual tanpa narasi" }] }`,
            prompt: `Postingan ${userPersona.name}: "${newPost.content}"`
          });
          const parsed = JSON.parse(raw);
          const likerIds = (parsed.likes || [])
            .map((n) => audience.find((c) => c.name.toLowerCase() === n.toLowerCase())?.id)
            .filter(Boolean);
          const newComments = (parsed.comments || [])
            .map((cm, i) => {
              const found = audience.find((c) => c.name.toLowerCase() === cm.authorName?.toLowerCase());
              if (!found || !cm.text) return null;
              return {
                id: `fc-${Date.now()}-${i}`,

                authorName: found.name,
                text: cm.text.replace(/\*[^*]+\*/g, '').trim(),
                timestamp: Date.now() + i * 200
              };

            .filter(Boolean);

          setPosts((prev) =>
            prev.map((p) =>
              p.id === newPost.id
                ? {

                    likes: Array.from(new Set([...(p.likes || []), ...likerIds])),

          text: formattedText,
          timestamp: Date.now()
        };

        setPosts((prev) =>
          prev.map((p) => (p.id === postId ? { ...p, comments: [...(p.comments || []), userComment] } : p))
        );

        try {
          const allCharsDesc = characters.map((c) => `${c.name}: ${c.personality.slice(0, 220)}`).join('\n');
          const threadStr = [...(targetPost.comments || []), userComment]
            .slice(-8)

Format JSON: { "replies": [{ "authorName": "NamaKarakter", "text": "isi balasan" }] }`,

          const newPost = {

        } catch {

Karakter:\n${charList}\nFormat JSON: { "replies": [{ "authorName": "NamaKarakter", "text": "komentar" }] }`,

          <div className="min-h-screen bg-[#121117] text-white flex flex-col items-center justify-center p-6">
            <div className="w-full max-w-xs text-center space-y-5">
              <div className="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center" style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}>
                <Lock className="w-8 h-8" />
              </div>
              <div>
                <h1 className="text-xl font-bold">OriChat Terkunci</h1>
                <p className="text-xs text-gray-400 mt-1">Masukkan 4 digit PIN untuk membuka ruang pribadimu</p>
              </div>
              <input
                type="password"
                maxLength={4}
                inputMode="numeric"
                value={pinAttempt}
                onChange={(e) => {
                  const val = e.target.value.replace(/\D/g, '');
                  setPinAttempt(val);
                  if (val.length === 4) {
                    if (val === settings.pin) {
                      setIsLocked(false);
                      setPinAttempt('');
                    } else {
                      showToast('PIN salah!');
                      setPinAttempt('');
                    }
                  }
                }}
                placeholder="••••"
                className="w-full text-center tracking-[1em] text-2xl py-3 rounded-2xl bg-[#1C1A24] border border-white/10 outline-none"
              />
              {toastMsg && <p className="text-xs text-rose-400">{toastMsg}</p>}
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex justify-center ${isDarkMode ? 'bg-[#121117] text-white' : 'bg-[#F6F5FA] text-gray-900'}`}>
          <div className="w-full max-w-md flex flex-col min-h-screen relative pb-16">
            {toastMsg && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-xs font-semibold text-white shadow-lg" style={{ backgroundColor: activeTheme.primary }}>
                {toastMsg}
              </div>
            )}

            {activeTab === 'beranda' && (
              <>
                <div className={`sticky top-0 z-20 px-4 py-3.5 border-b backdrop-blur-md flex items-center justify-between ${isDarkMode ? 'bg-[#121117]/90 border-white/10' : 'bg-white/90 border-gray-200'}`}>
                  <div>
                    <h1 className="font-bold text-lg tracking-tight" style={{ color: activeTheme.primary }}>OriChat</h1>
                    <div className="flex items-center gap-1.5 text-[11px] text-gray-400">
                      <span>Selamat {getGreetingPeriod()}, {userPersona.name}</span>
                      <span>·</span>
                      <span className={`inline-flex items-center gap-1 ${settings.hideOnlineStatus ? 'text-gray-400' : 'text-emerald-400'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${settings.hideOnlineStatus ? 'bg-gray-400' : 'bg-emerald-400'}`} />
                        {settings.hideOnlineStatus ? 'Tersembunyi' : 'Online'}
                      </span>
                    </div>
                  </div>
                  <div className={`flex p-1 rounded-full border ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-gray-100 border-gray-200'}`}>
                    <button
                      onClick={() => setBerandaSubTab('feed')}
                      className={`px-3.5 py-1 rounded-full text-xs font-semibold transition ${berandaSubTab === 'feed' ? 'text-white' : 'text-gray-400'}`}
                      style={berandaSubTab === 'feed' ? { backgroundColor: activeTheme.primary } : {}}
                    >
                      Feed
                    </button>
                    <button
                      onClick={() => setBerandaSubTab('explore')}
                      className={`px-3.5 py-1 rounded-full text-xs font-semibold transition ${berandaSubTab === 'explore' ? 'text-white' : 'text-gray-400'}`}
                      style={berandaSubTab === 'explore' ? { backgroundColor: activeTheme.primary } : {}}
                    >
                      Karakter
                    </button>
                  </div>
                </div>

                {berandaSubTab === 'feed' ? (
                  <SocialFeedView
                    posts={posts}
                    characters={characters}
                    userPersona={userPersona}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onCreatePost={() => setActiveScreen({ type: 'createPost' })}
                    onToggleLike={(postId) => {
                      setPosts((prev) =>
                        prev.map((p) => {
                          if (p.id !== postId) return p;
                          const exists = (p.likes || []).includes('user');
                          return {
                            ...p,
                            likes: exists ? p.likes.filter((x) => x !== 'user') : [...(p.likes || []), 'user']
                          };
                        })
                      );
                    }}
                    onAddComment={handleAddCommentToPost}
                    onTriggerCharPost={handleTriggerCharacterPost}
                    onSparkMoreComments={handleSparkMoreComments}
                    onRegeneratePostPhoto={handleRegeneratePostPhoto}
                  />
                ) : (
                  <ExploreCharactersView
                    characters={characters}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onOpenChat={openPersonalChat}
                    onOpenProfile={(charId) => setActiveScreen({ type: 'charProfile', charId })}
                    onCreateNew={() => setActiveScreen({ type: 'charForm', char: null })}
                  />
                )}
              </>
            )}

            {activeTab === 'obrolan' && (
              <>
                <div className={`sticky top-0 z-20 px-4 py-3.5 border-b backdrop-blur-md flex items-center justify-between ${isDarkMode ? 'bg-[#121117]/90 border-white/10' : 'bg-white/90 border-gray-200'}`}>
                  <h1 className="font-bold text-lg">Obrolan</h1>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setActiveScreen({ type: 'createGroup' })}
                      className="px-3 py-1.5 rounded-full text-xs font-semibold border flex items-center gap-1"
                      style={{ borderColor: activeTheme.primary, color: activeTheme.primary }}
                    >
                      <Users className="w-3.5 h-3.5" /> Grup
                    </button>
                    <button
                      onClick={() => setActiveScreen({ type: 'charForm', char: null })}
                      className="p-2 rounded-full text-white"
                      style={{ backgroundColor: activeTheme.primary }}
                    >
                      <Plus className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="p-4 space-y-5">
                  <div className="space-y-2">
                    <h2 className="text-xs font-bold uppercase tracking-wider text-gray-400">Chat Grup ({groups.length})</h2>
                    {groups.map((grp) => {
                      const lastMsg = grp.messages[grp.messages.length - 1];
                      return (
                        <div
                          key={grp.id}
                          onClick={() => setActiveScreen({ type: 'groupChat', groupId: grp.id })}
                          className={`p-3.5 rounded-2xl border flex items-center gap-3 cursor-pointer ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200 shadow-sm'}`}
                        >
                          <div className="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0" style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}>
                            <Users className="w-6 h-6" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between">
                              <h3 className="font-bold text-sm truncate">{grp.name}</h3>
                              <span className="text-[10px] text-gray-400">{formatTimeShort(lastMsg?.timestamp)}</span>
                            </div>
                            <p className="text-xs text-gray-400 truncate mt-0.5">
                              {lastMsg ? `${lastMsg.senderName}: ${lastMsg.text || '[Media]'}` : 'Belum ada pesan'}
                            </p>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="space-y-2">
                    <h2 className="text-xs font-bold uppercase tracking-wider text-gray-400">Obrolan Personal ({characters.length})</h2>
                    {characters.map((char) => {
                      const cData = chats[char.id];
                      const lastMsg = cData?.messages?.[cData.messages.length - 1];
                      return (
                        <div
                          key={char.id}
                          onClick={() => openPersonalChat(char.id)}
                          className={`p-3.5 rounded-2xl border flex items-center gap-3 cursor-pointer ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200 shadow-sm'}`}
                        >
                          <div className="relative shrink-0">
                            <img src={char.avatar} alt={char.name} className="w-12 h-12 rounded-full object-cover" />
                            <span className="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-400 ring-2 ring-[#1C1A24]" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between">
                              <h3 className="font-bold text-sm truncate">{char.name}</h3>
                              <span className="text-[10px] text-gray-400">{formatTimeShort(lastMsg?.timestamp)}</span>
                            </div>
                            <p className="text-xs text-gray-400 truncate mt-0.5">
                              {lastMsg ? (lastMsg.sticker ? `[Stiker: ${lastMsg.sticker.label}]` : lastMsg.text || '[Foto]') : char.greetings?.[0]}
                            </p>
                          </div>
                          {(cData?.unread || 0) > 0 && (
                            <span className="min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-bold text-white flex items-center justify-center" style={{ backgroundColor: activeTheme.primary }}>
                              {cData.unread}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

            {activeTab === 'saya' && (
              <div className="p-4 space-y-5">
                <div
                  onClick={() => setActiveScreen({ type: 'userPersona' })}
                  className={`p-4 rounded-3xl border flex items-center justify-between cursor-pointer ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200 shadow-sm'}`}
                >
                  <div className="flex items-center gap-3.5">
                    <img src={userPersona.avatar} alt={userPersona.name} className="w-14 h-14 rounded-full object-cover border-2" style={{ borderColor: activeTheme.primary }} />
                    <div>
                      <h2 className="font-bold text-base">{userPersona.name}</h2>
                      <p className="text-xs text-gray-400 line-clamp-1">{userPersona.bio}</p>
                    </div>
                  </div>
                  <ChevronRight className="w-4 h-4 text-gray-400" />
                </div>

                <div className={`rounded-3xl border divide-y divide-white/5 overflow-hidden ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200 shadow-sm'}`}>
                  <MenuRow
                    icon={<BookOpen className="w-4 h-4" />}
                    label="Koleksi Buku Harian"
                    value={`${diaries.length} catatan`}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onClick={() => setActiveScreen({ type: 'diaries', charId: null })}
                  />
                  <MenuRow
                    icon={<Smartphone className="w-4 h-4" />}
                    label="Ponsel Karakter"
                    value={`${phoneHistory.length} riwayat`}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onClick={() => setActiveScreen({ type: 'charPhone', charId: characters[0]?.id })}
                  />
                  <MenuRow
                    icon={<Palette className="w-4 h-4" />}
                    label="Tema & Tampilan"
                    value={activeTheme.name}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onClick={() => setActiveScreen({ type: 'theme' })}
                  />
                  <MenuRow
                    icon={<Sparkles className="w-4 h-4" />}
                    label="Model Dialog & Sapaan"
                    value={settings.apiKey ? 'API Aktif' : 'Atur API'}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onClick={() => setActiveScreen({ type: 'apiSettings' })}
                  />
                  <MenuRow
                    icon={<Shield className="w-4 h-4" />}
                    label="Privasi, PIN & Backup Data"
                    value={settings.hideOnlineStatus ? 'Status Tersembunyi' : settings.pin ? 'PIN Aktif' : 'Online Terlihat'}
                    activeTheme={activeTheme}
                    isDarkMode={isDarkMode}
                    onClick={() => setActiveScreen({ type: 'security' })}
                  />
                </div>

                <div className={`p-4 rounded-3xl border space-y-3 ${isDarkMode ? 'bg-[#1C1A24] border-white/10' : 'bg-white border-gray-200 shadow-sm'}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-3">
                      <div
                        className="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
                        style={{ backgroundColor: activeTheme.primarySoft, color: activeTheme.primary }}
                      >
                        <Download className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="text-sm font-bold">Aplikasi OriChat (PWA)</h3>
                        <p className="text-[11px] text-gray-400">
                          {isStandalonePwa
                            ? 'Sudah terpasang dalam mode layar penuh.'
                            : 'Pasang ke layar utama HP Android agar tampil tanpa bilah browser.'}
                        </p>
                      </div>
                    </div>
                  </div>

                  {!isStandalonePwa && (
                    <button
                      type="button"
                      onClick={handleInstallPwaClick}
                      className="w-full py-2.5 rounded-2xl text-xs font-bold text-white flex items-center justify-center gap-2 shadow-sm transition active:scale-98"
                      style={{ backgroundColor: activeTheme.primary }}
                    >
                      <Smartphone className="w-4 h-4" /> Instal OriChat ke Layar Utama
                    </button>
                  )}
                </div>

                {showPwaGuideModal && (
                  <div
                    onClick={() => setShowPwaGuideModal(false)}
                    className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-4"
                  >
                    <div
                      onClick={(e) => e.stopPropagation()}
                      className={`w-full max-w-sm rounded-3xl p-5 space-y-4 border ${isDarkMode ? 'bg-[#1C1A24] border-white/10 text-white' : 'bg-white border-gray-200 text-gray-900'}`}
                    >
                      <div className="flex items-center justify-between">
                        <h3 className="font-bold text-base">Cara Instal OriChat di HP</h3>
                        <button onClick={() => setShowPwaGuideModal(false)} className="p-1 text-gray-400 hover:text-white">
                          <X className="w-5 h-5" />
                        </button>
                      </div>
                      <p className="text-xs text-gray-400">
                        Jika jendela instalasi otomatis belum muncul, ikuti 3 langkah singkat berikut melalui browser Chrome:
                      </p>
                      <ol className="space-y-2.5 text-xs">
                        <li className="flex items-start gap-2.5">
                          <span className="w-5 h-5 rounded-full text-[11px] font-bold text-white flex items-center justify-center shrink-0 mt-0.5" style={{ backgroundColor: activeTheme.primary }}>1</span>
                          <span>Ketuk ikon menu <strong>titik tiga (⋮)</strong> di pojok kanan atas Google Chrome.</span>
                        </li>
                        <li className="flex items-start gap-2.5">
                          <span className="w-5 h-5 rounded-full text-[11px] font-bold text-white flex items-center justify-center shrink-0 mt-0.5" style={{ backgroundColor: activeTheme.primary }}>2</span>
                          <span>Pilih menu <strong>"Tambahkan ke layar utama"</strong> (<em>Add to Home screen</em>).</span>
                        </li>
                        <li className="flex items-start gap-2.5">
                          <span className="w-5 h-5 rounded-full text-[11px] font-bold text-white flex items-center justify-center shrink-0 mt-0.5" style={{ backgroundColor: activeTheme.primary }}>3</span>
                          <span>Pilih <strong>"Instal"</strong> lalu buka ikon <strong>OriChat</strong> langsung dari layar utama HP.</span>
                        </li>
                      </ol>
                      <button
                        type="button"
                        onClick={() => setShowPwaGuideModal(false)}
                        className="w-full py-2.5 rounded-2xl text-xs font-bold text-white"
                        style={{ backgroundColor: activeTheme.primary }}
                      >
                        Mengerti
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md border-t flex items-center justify-around z-30 backdrop-blur-md ${isDarkMode ? 'bg-[#121117]/95 border-white/10' : 'bg-white/95 border-gray-200'}`}>
              <NavButton
                icon={<Home className="w-5 h-5" />}
                label="Beranda"
                active={activeTab === 'beranda'}
                activeTheme={activeTheme}
                onClick={() => setActiveTab('beranda')}
              />
              <NavButton
                icon={<MessageCircle className="w-5 h-5" />}
                label="Obrolan"
                active={activeTab === 'obrolan'}
                badge={totalUnread}
                activeTheme={activeTheme}
                onClick={() => setActiveTab('obrolan')}
              />
              <NavButton
                icon={<User className="w-5 h-5" />}
                label="Saya"
                active={activeTab === 'saya'}
                activeTheme={activeTheme}
                onClick={() => setActiveTab('saya')}
              />
            </div>

            {activeScreen?.type === 'chat' && (
              <PersonalChatScreen
                char={characters.find((c) => c.id === activeScreen.charId)}
                chatData={chats[activeScreen.charId] || { messages: [], meetRecaps: [] }}
                userPersona={userPersona}
                settings={settings}
                presenceContext={presenceContext}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                customStickers={customStickers}
                onAddCustomSticker={(stk) => setCustomStickers((p) => [stk, ...p])}
                onOpenCharPhone={(cId) => setActiveScreen({ type: 'charPhone', charId: cId })}
                onBack={() => setActiveScreen(null)}
                onUpdateChat={(updater) =>
                  setChats((prev) => ({
                    ...prev,
                    [activeScreen.charId]: updater(prev[activeScreen.charId] || { messages: [], meetRecaps: [] })
                  }))
                }
                onOpenCharProfile={(cId) => setActiveScreen({ type: 'charProfile', charId: cId })}
                onGenerateDiary={(charObj, summary) =>
                  generateDiaryEntryForChar({
                    char: charObj,
                    contextSummary: summary,
                    userPersona,
                    apiKey: settings.apiKey,
                    onSuccess: (entry) => setDiaries((p) => [entry, ...p])
                  })
                }
                onTriggerPresenceReaction={triggerPresenceReactionForCharacter}
                showToast={showToast}
              />
            )}

            {activeScreen?.type === 'groupChat' && (
              <GroupChatScreen
                group={groups.find((g) => g.id === activeScreen.groupId)}
                characters={characters}
                userPersona={userPersona}
                settings={settings}
                presenceContext={presenceContext}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                customStickers={customStickers}
                onAddCustomSticker={(stk) => setCustomStickers((p) => [stk, ...p])}
                onBack={() => setActiveScreen(null)}
                onUpdateGroup={(updated) =>
                  setGroups((prev) => prev.map((g) => (g.id === updated.id ? updated : g)))
                }
                onTriggerPrivateDM={handleTriggerPrivateDM}
                showToast={showToast}
              />
            )}

            {activeScreen?.type === 'charProfile' && (
              <CharacterProfileScreen
                char={characters.find((c) => c.id === activeScreen.charId)}
                diaryCount={diaries.filter((d) => d.characterId === activeScreen.charId).length}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onBack={() => setActiveScreen(null)}
                onStartChat={() => openPersonalChat(activeScreen.charId)}
                onOpenDiary={() => setActiveScreen({ type: 'diaries', charId: activeScreen.charId })}
                onOpenPhone={() => setActiveScreen({ type: 'charPhone', charId: activeScreen.charId })}
                onEdit={() =>
                  setActiveScreen({
                    type: 'charForm',
                    char: characters.find((c) => c.id === activeScreen.charId)
                  })
                }
                onDelete={() => {
                  setCharacters((prev) => prev.filter((c) => c.id !== activeScreen.charId));
                  setActiveScreen(null);
                  showToast('Karakter dihapus.');
                }}
              />
            )}

            {activeScreen?.type === 'charForm' && (
              <CharacterFormScreen
                existingChar={activeScreen.char}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onSave={(savedChar) => {
                  setCharacters((prev) => {
                    const exists = prev.some((c) => c.id === savedChar.id);
                    return exists ? prev.map((c) => (c.id === savedChar.id ? savedChar : c)) : [savedChar, ...prev];
                  });
                  setActiveScreen(null);
                  showToast('Karakter berhasil disimpan!');
                }}
                onBack={() => setActiveScreen(null)}
              />
            )}

            {activeScreen?.type === 'createGroup' && (
              <CreateGroupScreen
                characters={characters}
                apiKey={settings.apiKey}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onCreate={(newGrp) => {
                  setGroups((prev) => [newGrp, ...prev]);
                  setActiveScreen({ type: 'groupChat', groupId: newGrp.id });
                }}
                onBack={() => setActiveScreen(null)}
              />
            )}

            {activeScreen?.type === 'createPost' && (
              <CreatePostScreen
                characters={characters}
                userPersona={userPersona}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onPublish={handlePublishPost}
                onBack={() => setActiveScreen(null)}
              />
            )}

            {activeScreen?.type === 'charPhone' && (
              <CharacterPhoneScreen
                char={characters.find((c) => c.id === activeScreen.charId)}
                allCharacters={characters}
                chatData={chats[activeScreen.charId]}
                groups={groups}
                userPersona={userPersona}
                apiKey={settings.apiKey}
                phoneHistory={phoneHistory}
                onSaveSnapshot={(snap) => setPhoneHistory((prev) => [snap, ...prev])}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onBack={() => setActiveScreen(null)}
                showToast={showToast}
              />
            )}

            {activeScreen?.type === 'diaries' && (
              <DiaryCollectionScreen
                characters={characters}
                diaries={diaries}
                initialCharId={activeScreen.charId}
                chats={chats}
                userPersona={userPersona}
                apiKey={settings.apiKey}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onBack={() => setActiveScreen(null)}
                onAddDiary={(entry) => setDiaries((prev) => [entry, ...prev])}
                showToast={showToast}
              />
            )}

            {activeScreen?.type === 'theme' && (
              <ThemeSettingsScreen
                settings={settings}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onUpdateSettings={(patch) => setSettings((prev) => ({ ...prev, ...patch }))}
                onBack={() => setActiveScreen(null)}
              />
            )}

            {activeScreen?.type === 'apiSettings' && (
              <ApiSettingsScreen
                settings={settings}
                characters={characters}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onUpdateSettings={(patch) => setSettings((prev) => ({ ...prev, ...patch }))}
                onSimulateGreeting={handleSimulateGreeting}
                onBack={() => setActiveScreen(null)}
                showToast={showToast}
              />
            )}

            {activeScreen?.type === 'userPersona' && (
              <UserPersonaScreen
                userPersona={userPersona}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onSave={(updated) => {
                  setUserPersona(updated);
                  setActiveScreen(null);
                  showToast('Persona pengguna disimpan!');
                }}
                onBack={() => setActiveScreen(null)}
              />
            )}

            {activeScreen?.type === 'security' && (
              <SecurityBackupScreen
                settings={settings}
                activeTheme={activeTheme}
                isDarkMode={isDarkMode}
                onUpdateSettings={(patch) => setSettings((prev) => ({ ...prev, ...patch }))}
                onExportData={handleExportData}
                onImportData={handleImportData}
                onBack={() => setActiveScreen(null)}
                showToast={showToast}
              />
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
